<script>
const CHAPTERS = [{"title": "楔子：蝶", "html": "<p>那一年春天，庄周在蒙地的柳树下睡着了。</p>\n<p>那是宋国再寻常不过的一个午后。柳絮浮在斜阳里，落得极慢，慢得近乎迟疑，仿佛天上有什么人在犹豫，要不要把它们放下来。</p>\n<p>庄子名周，做过漆园吏，如今不在衙门当值了，住在穷闾陋巷，靠编草鞋换几升粟米。屋里他的妻子正在舂米，杵声一下一下，稳得像更漏。他坐在柳树下，膝头摊着半只没编完的鞋底，腰带上拴着一枚磨平了字的旧钱——钱是什么时候得的，已经没人记得，字磨没了，只剩一圈温润的包浆。他闲时拿它在指间转着玩，像转一枚没有谜面的谜。</p>\n<p>今天他没有编鞋。他看蚂蚁搬一只死去的甲虫。蚂蚁排成一条细细的黑线，井然有序，前赴后继，围着一具比自己大出几十倍的尸首奔忙。他看了很久，忽然觉得倦了，便枕着手臂，躺进柳树的影子里，心想：睡一会儿。天塌下来，也不过是一场从很高处开始的坠落。</p>\n<p>然后他就睡着了。</p>\n<p>梦里没有庄周。</p>\n<p>梦里是一只蝴蝶。翅面是青金石般的蓝，边缘镶一道细金线，阳光穿过来时，整片翅膀薄得像一段会呼吸的黄昏。它从一朵野蔷薇飞向另一朵，翅尖每一次轻颤，都在空气里留下看不见的涟漪。它不知道什么是蒙地，什么是宋国，不知道什么是漆园和赋税，也不知道脚下这片土地十年后将归哪个大国所有。它甚至不知道自己是蝴蝶——&quot;知道&quot;这个词，在梦里还没有被发明。</p>\n<p>它只是飞。风托着它，花香抬着它，整个春天是一张专为它绷好的大床。它掠过溪水，水里的影子掠过它；它在一瓣花上收拢翅膀，那一刻天地安静得庄严，仿佛万物都在等它合拢。</p>\n<p>后来起了一阵风。</p>\n<p>蝴蝶被掀离花瓣，向着高处、亮处翻滚上去。它拼命扑打翅膀——就在下一次振翅之前，整片天地忽然碎了，像一面水面被指尖轻轻点破。</p>\n<p>柳叶的碎影落在一张人的脸上。是他的脸。</p>\n<p>庄周躺着没动。他先看自己的手——一双编屦的手，指节粗大，掌心有茧。再看头顶的柳树、远处陶窑的炊烟、近处那具已被蚂蚁拆解干净的甲虫。一切都在原位，一切都很结实。</p>\n<p>按理说，醒来的人只有一件事可做：接着编那只鞋底。</p>\n<p>可他坐着没动。因为心里横着一个问题，细得像一根丝，却勒得紧紧的：</p>\n<p>方才，是庄周梦中做了蝴蝶，还是此刻，一只蝴蝶梦中做了庄周？</p>\n<p>他是喜欢把问题掰开来看的人。他试着去找两个世界的接缝。</p>\n<p>梦的那一边，粗糙：蝴蝶没有名字，没有昨天，也想不起明天；飞不过一条溪，翅膀沾了水便要坠下来；连梦本身都是残缺的，像一件没上完漆的器物。</p>\n<p>这一边，精细：手上有茧，杵声有节拍，炊烟有轻重，连饥饿都有确切的方位。可正是这份精细叫他起了疑心——他记得自己的一生：记得妻子未嫁时在河边浣过一匹葛布，记得去年秋天儿子第一次编成一只完整的鞋底。可这些记忆，谁来验看过它们的来路？它们安安稳稳码在那里，不由分说地存在着——就像……就像梦里的花香。</p>\n<p>倘若记忆不需要凭据便能叫人信以为真，又凭什么说，此刻的一切就不是另一种香？</p>\n<p>他低头看那枚旧钱，在指间转了一圈。字磨没了，钱还在。他忽然笑了。</p>\n<p>想不通的事，未必需要想通。周就是周，蝶就是蝶，两者必有分别——只是这分别不是一堵墙，而是一道流水：自此物到彼物的一场流转。人既要在流转里换过一副副形骸，那么在柳树下换作蝴蝶，在花丛里换作庄周，又有什么可惊惶的？追问哪一边更真，就像问河的上游与下游，哪一段才是河。</p>\n<p>他把这个念头收好，像把一根针别回衣襟，拾起鞋底，继续编。</p>\n<p>杵声还在响。悬了半日的柳絮，终于落了下来。</p>\n<p>那天晚饭，他把这件事讲给妻子听。妻子想了想，答：白日里睡觉，自然要做梦。</p>\n<p>他点点头，没有再说。世上人人都这样回答，所以世上人人都不写这样的书。只有他自己知道，方才那一瞬，有什么东西裂开过一道缝——缝后头不是黑夜，也不是白昼，是层层叠叠、不知深浅的光。</p>\n<p>两千四百年后，有人把这个梦，做成了一台机器。</p>", "vol": null}, {"title": "第1章：病人", "html": "<p>2050年的春天，蜃楼计划总部大楼的第十四层，住着三十七位病人。</p>\n<p>他们不再被称作植物人。最新的医学文书里，这种状态有个冗长的名字——持续意识沉默症：脑干完好，心跳呼吸无需机器代劳，各项体征平稳得像一个只是睡着了的人。只是那个通常被称为&quot;本人&quot;的东西不知去向。神经科的老教授打过一个比方：这样的病人像一栋所有窗户都亮着灯的房子，你挨个敲门，没有人应。</p>\n<p>蜃楼计划的思路，简单得近乎莽撞：既然叫不应，就走进去。</p>\n<p>原理写在每份立项材料的扉页上。人脑从来不直接接触世界，它只接触自己：视网膜上的光斑、耳蜗里的气压波、皮肤上的温度梯度，最终都被翻译成同一种东西——电化学信号。大脑是一台永远只对自己放电影的放映机，所谓现实，不过是正在放映的那一卷。既然如此，为什么不直接给它换一卷胶片？</p>\n<p>这就是&quot;梦桥&quot;：一百二十八组超导感应环排成一顶王冠，扣在病人头皮上，读出残存皮层里那些散乱的放电风暴，翻译、补全、重新组织，再以低强度电磁场注回去——注进去的不是噪声，而是一段结构完整、连续推进的梦境流。像给一只断了线的风筝，重新系上看不见的线。</p>\n<p>判断有没有人开始往回走，只看一个数字：意识复杂度指数，PCI。这个从扰动响应里算出来的无量纲数，低于0.31，大脑是一块整齐的石头；越过0.44，房间里有人。</p>\n<p>三年间，三十七位病人里，有九位醒了过来。第九位是个六岁的男孩，睁眼后说的第一句话是问妈妈要水喝。那段监控视频在全球网络上播放了四十亿次。资本像候鸟追踪一条暖流，从四面八方赶到这座南方城市的郊区。</p>\n<p>陆离是这项计划的首席。</p>\n<p>他四十一岁，头发剪得很短，衬衫永远熨得平整。所里的年轻人怕他，不是因为严厉——他几乎从不批评人——而是因为他有一种过分干净的精确：实验记录里没有一个模糊的形容词，答辩幻灯上没有一行多余的字。评审委员会的人私下说，陆离的报告像手术台，器械按尺寸排列，连血都擦掉了。</p>\n<p>只有一个人见过他不整洁的样子。那个人现在躺在同一层楼最尽头的特护病房里。</p>\n<p>林晚，三十九岁，昏迷第九十七天。</p>\n<p>事故发生在去年冬天。那晚陆离在所里赶一份给伦理委员会的技术报告，她打电话来说自己去接母亲，让他别管。雨很大，高架桥上有一辆刹车失灵的厢式货车。他是在所里接到交警电话的；等他赶到医院，已经过去了二十分钟——后来这二十分钟在他脑子里重放了不下十万次，每一次都更长一些。</p>\n<p>医疗鉴定写得克制：不可逆性未见明确证据，建议持续观察。翻译过来就是：没人知道她会不会醒，也没人知道她算不算还在。</p>\n<p>陆离每天下班都去看她，做两件事。第一件是替她做手部护理，把保湿霜涂在她指节上。她的左手腕内侧有一道浅白色的旧疤，弯弯的，像一钩新月——她从小就带着，他从前笑说，月亮总得落在一个人手上，结果落在了她身上。第二件事，是跟她说话。医生说听觉通路可能仍然完好，他就把白天的事讲给她听：哪个实验组的曲线收敛了，食堂的糖醋排骨退步了，楼下的玉兰开了又谢了。</p>\n<p>他讲这些的时候语气很稳，像汇报工作。整个第十四层，只有清洁机器人知道，首席工程师每次都要在关灯之后再坐十一分钟，一动不动。</p>\n<p>伦理委员会三次驳回了他将林晚纳入实验组的申请。理由充分且正确：直系亲属关系构成利益冲突，申请人不得参与任何存在利益关联的临床操作。陆离在驳回通知书上签了字，字迹一如既往地平稳。</p>\n<p>然后，在一个下雨的凌晨两点，他用首席权限打开了零号舱。</p>\n<p>零号舱是校准设备用的，不在临床序列里，不进数据库报表。他把王冠扣在她的头皮上，动作比给自己戴还要轻。导电凝胶凉得像春夜的雨水。他调暗了观察间的灯，把注入功率压到安全下限的三分之一，然后俯下身去，声音低得像怕吵醒谁：</p>\n<p>&quot;别怕。要是难受，就掐我。&quot;</p>\n<p>他笑了一下，意识到这个笑话有多荒唐，又没舍得收回。</p>\n<p>单向观察链路启动了。严格说，那不是摄像机——系统读出她视觉皮层里的信号，反演成画面，投在他面前的屏幕上。画质很差，灰绿色的噪点，像隔着毛玻璃看水底。理论上是绝对单向的：她看不见他，就像梦里的角色看不见做梦的人。</p>\n<p>前十几分钟什么都没有。噪点起伏，如同未凝固的夜。</p>\n<p>然后，走廊出现了。</p>\n<p>不是第十四层的走廊。这条走廊更旧：齐腰的深绿色墙裙，水磨石地面，顶灯一盏一盏排向远处，光线昏黄。她的视点在移动，很慢，每一步都带来一次轻微的上下晃动，让人恍惚觉得听见了脚步声落进空旷里。两侧病房的门都关着，门牌上的编号看不清。有一个瞬间，某扇门底下漏出一线极细的光，她的视点停了一下——没有推门，继续往前走。</p>\n<p>陆离屏住呼吸。他知道这条走廊。三十年前，他母亲住院的那家县医院，就是这种绿色墙裙。他没有对任何人讲过那些走廊的样子——讲了也没有意义，那不是值得讲述的记忆，只是一个孩子蹲在长椅边等探视时间的下午。</p>\n<p>可它在。在她梦里，一笔一画，分毫不差。</p>\n<p>视点走到走廊尽头，是一扇玻璃门。门外的光太亮了，亮得不合理，像整个天空只是一块对着灯的白布。她抬手挡了一下——那只手从画面下方探进来，苍白，纤细，无名指上有一圈极淡的印痕，是婚戒留下的。住院手环还扣在腕上，戒指早就摘了。</p>\n<p>陆离的眼眶热起来。他提醒自己是工程师：视觉皮层信号的反演充满伪影，亮度失真是常见误差。不要激动。记录，采样，保持专业。</p>\n<p>她没有推门。</p>\n<p>视点转了过来——背对着那片白光。走廊另一侧的墙上有一样东西，那个年代的医院都有：一排铝合金边框的玻璃宣传栏，玻璃后面贴着泛黄的科室分布图和健康宣教海报。走廊昏暗，玻璃后的纸页更暗，玻璃面便沉静下来，像一面蒙尘的镜子。</p>\n<p>她走到宣传栏前，站定。反演画面里第一次出现了林晚本人：洗旧的病号服，散着的头发，一张瘦下去的脸，身后的白光替她勾出一圈毛边。她重新抬起手，五指张开，轻轻按在玻璃上——这一次不是挡光。</p>\n<p>然后是目光。</p>\n<p>人在镜子里看自己时，视线是游移的：看发际，看领口，看眼下有没有添新的细纹。她不。她的目光钉死在正前方的同一点上，透过玻璃里自己的瞳孔，一动不动地向深处看。</p>\n<p>陆离做了三年链路，却花了好一会儿才明白这个姿势在物理上意味着什么。</p>\n<p>链路不是架在走廊里的摄影机。屏幕上的每一帧都反演自她的视觉皮层信号，因此整幅画面有且只有一个视点——她自己那双眼睛。这条走廊里没有第二双眼睛，也没有任何一个属于&quot;观看者&quot;的位置。</p>\n<p>梦里的人若想回望观看者，物理上便只剩下一种做法：望进镜面中自己瞳孔的最深处，沿着视线一路向内——视网膜，视神经，视皮层。在这条视线的尽头、梦的外侧，坐着一个忘了呼吸的工程师；而在梦自己的逻辑里，一双眼睛向内望去，最终抵达的地方，只属于它的主人。</p>\n<p>做梦的人。</p>\n<p>理论上，链路是单向的；理论上，梦里的人不可能知道哪里有一双眼睛。</p>\n<p>林晚在人群里找他的时候，从来都是这样：先找到眼睛，再落到嘴唇上，像要把一句还没说出口的话先放在那里。</p>\n<p>然后，玻璃里的林晚，笑了。</p>\n<p>画面猛地撕开一道刺目的白。警报响起，PCI读数从0.29一路跳到0.51——三年来没有任何病人在单次会话里越过0.44——随后保护性中止触发，链路熄灭。熄灭前的最后一格里，有一样东西烧在了他的视网膜上：</p>\n<p>画面深处，昏黄的雾里，立着一道淡白色的长弧，安静地跨过看不见的两端。</p>\n<p>像一座桥。</p>\n<p>观察间里只剩仪器的待机声。陆离在黑暗里坐了很久，没有开灯。作为首席工程师，他应该立刻想到的事情很多：数据备份、日志脱敏、这次违规操作的每一个后果。他都想到了，一样一样想过去，像清点一船必须扔下的货物。</p>\n<p>真正占住他的，是一个不合逻辑的问题。</p>\n<p>她认得他。梦里的那个人，用林晚的方式找到了他。可是按照蜃楼自己的理论，梦是注入的，场景是生成的，人物是模型合成的——那么那个&quot;认得他的林晚&quot;，究竟是从九十七天的沉默里带上来的，还是他自己带来的？是他日复一日坐在床边，把这双眼睛一笔一笔教给了自己的梦？</p>\n<p>还有那条走廊。绿色墙裙，水磨石地面——那是他的记忆：三十年前，母亲住院的那家县医院。他从没对任何人讲过那些走廊，讲了也没有意义。蜃楼读的是她的皮层，为什么放出来的，却是他的一个下午？</p>\n<p>他调出零号舱的运行日志，一直翻到三个月前。最后一次基线校准，扫描对象一栏写着：陆离。校准是规定动作，由他亲自完成。也就是说，这台机器的深处存着一份他的神经底稿；今晚注给她的梦境流，完全可能从那份底稿里借走了布景。</p>\n<p>这个解释干净、技术、无懈可击：走廊可以是借来的布景，墙裙和水磨石都取自那份神经底稿。他把日志关掉，像把一件湿透的大衣挂好。</p>\n<p>可是布景不会认人。底稿解释得了一条走廊，解释不了解宣传栏玻璃里那一眼——布景搭出来只是给人看的，它不知道谁在看，更不会隔着玻璃，冲着看的人笑。</p>\n<p>他想起已故的顾一凡。</p>\n<p>前任首席，蜃楼的理论奠基人，三年前从所里旧楼的顶层坠了下去。警方结论是意外，楼梯的扶手确实锈了。顾一凡生前有个习惯：所有正式文件的扉页都要印一句《庄子》。立项书印的是&quot;昔者庄周梦为蝴蝶&quot;。他还嫌文言隔膜，用自己的话译了一遍，写在工牌背面，逢人就展示：</p>\n<p>——他梦见自己是蝴蝶。</p>\n<p>当年陆离只当是文人的雅趣。此刻，在凌晨三点零七分的黑暗里，这句话第一次让他感到物理意义上的冷。因为他忽然发现，庄子的怀疑和蜃楼的技术，说的是同一件事的两半：如果梦可以做得足够真，真到梦里的人认得出你——</p>\n<p>那么此刻坐在这里、心口发疼的他，凭什么豁免？</p>\n<p>清晨六点半，医疗AI完成例行晨检。特护病房03号，林晚：静息心率下降4次/分，深度睡眠占比上升17%，应激反射阈显著改善。结论栏写着：原因不明，建议复查。</p>\n<p>七点整，陆离的手机亮了。郑北辰的秘书发来行程通知，措辞客气得像刀子：郑先生明日上午抵达，议程一项——商用化的时间表。</p>\n<p>窗外，这座城市正在醒来。第一班地铁从地底钻出来，沿着高架把几千个刚睡醒的人送往各自的位置；外卖无人机贴着楼顶排队；第十四层的空调系统准时切换到日间模式，风穿过三十七间病房，均匀，安静，不带任何疑问。</p>\n<p>陆离站在这座苏醒的城市面前，握着手机，忽然觉得自己站在一面巨大的玻璃外侧——玻璃那边灯火通明，人声鼎沸，一切都运转如常。</p>\n<p>只是他再也不能确定，自己站的是哪一边。</p>", "vol": "卷一 · 蜃楼"}, {"title": "第2章：访客", "html": "<p>郑北辰比约定时间早到了九分钟。</p>\n<p>陆离后来想，这九分钟是算好的：早到太多是谄媚，迟到是傲慢，只有不多不少的这一截，能让人同时觉得被重视和被拿捏。</p>\n<p>关于郑北辰，公开资料能拼出一个标准的时代故事：能源贸易起家，四十岁前完成三次教科书级的低买高卖，如今旗下基金握着这座城市半数的写字楼和全国七座发电厂。传闻说他从不投看不懂的东西；另一条传闻说，他的投资从不亏。两条传闻放在一起，通常意味着有人替他删掉过亏损的历史。</p>\n<p>三辆黑色轿车无声地滑到楼前。2050年的电动车把安静做成了一种礼貌。郑北辰从第二辆下来：五十四岁，深灰西装，不打领带，步幅稳得像节拍器。身后跟着一个抱平板的助理和一个从不熄火的司机。没有寒暄。他的时间表里显然没有为寒暄留位置。</p>\n<p>&quot;陆教授。&quot;握手，力度经过校准。&quot;气色不太好。&quot;</p>\n<p>&quot;在科学这一行，气色不好算勋章。&quot;</p>\n<p>&quot;在我这一行，只算成本。&quot;郑北辰笑了，眼角的纹很深，像常年对着太阳看账本的人。</p>\n<p>会议室在第四十层。正午的阳光从落地窗整块铺进来，把长桌照成一块浅色的砧板。助理把平板立在桌头，图表一页页亮起。陆离注意到第一页不是财务，而是一张时间表——从今年夏天到后年春天，每个季度都填好了名字、数字和交付物。他的签字不在流程里，只在终点上等着。</p>\n<p>他忽然想起大学时见过的一种工程图：关键路径上每个节点都标注工期，唯独最后一个节点标注的是竣工日期而不是工期——因为终点从来不是算出来的，是定出来的。</p>\n<p>&quot;先说好消息。&quot;郑北辰坐下就说，&quot;梦桥的单台成本，三年降了七成；药监绿色通道批了两个适应症；全国登记在册的持续意识沉默症患者，十一万六千人——注意，这只是第一层市场。失眠八亿人；抑郁四亿；哀伤干预、临终关怀、临刑前最后一场好梦。家用版&#x27;小蜃楼&#x27;，授权连锁&#x27;梦诊所&#x27;，开进每座地级市。陆教授，蜃楼现在是一家医院，我要让它变成基础设施。像电，像自来水。&quot;</p>\n<p>&quot;梦不是水。&quot;陆离说。</p>\n<p>&quot;梦比水干净，水还有污染呢。&quot;</p>\n<p>&quot;先说钱。&quot;郑北辰调出下一页，&quot;治疗单次定价六万，医保谈判我已经让人去做了，两年内进目录。但真正的盘子在这儿——&quot;指尖一点，图表换成一条陡直上升的曲线，&quot;&#x27;小蜃楼&#x27;，家用版。头显比羽毛球拍还轻，睡前戴上，选一个好梦：放榜那天，婚礼当天，或者任何你想回去的一个下午。定价九千八，首年铺十万台。&quot;</p>\n<p>&quot;家用版的安全基线呢？&quot;</p>\n<p>&quot;和手机一样。&quot;郑北辰说，&quot;没有人要求手机证明自己无害。&quot;</p>\n<p>&quot;健康人的长期注入，一份安全性数据都没有。&quot;陆离说，&quot;医疗设备和消费电子之间，隔着伦理审查，不是隔着定价策略。&quot;</p>\n<p>&quot;隔着的是渠道。&quot;郑北辰不动声色，&quot;梦诊所走加盟：设备我们出，牌照他们办，医师我们培训。十一万六千张床之外，还有八亿失眠的人。他们不需要治疗，只需要睡个好觉。你不卖给他们，别人迟早会卖。&quot;</p>\n<p>&quot;别人做不出来。&quot;</p>\n<p>&quot;所以我才想让你一直做得出来。&quot;郑北辰笑了，&quot;二期扩建，四个亿，董事会昨天批的。钱到账之前，我只要你在商用化时间表上签一个字。&quot;</p>\n<p>陆离把一份材料推过去。&quot;我的反对意见都在里面。三十七个样本，随访最长的两年半；长期注入效应没有数据；伦理边界在病人和健康人身上是两回事。最后一条是我昨夜加急补进去的：生成器最近出现异常——不同病人的梦境流里，出现了重复构型，来源不明。查清之前不能商用。&quot;</p>\n<p>郑北辰翻到那一页，看了很久，比看其他所有页加起来都久。他读得极慢，指腹在每行字下面压出一道浅痕，像要把纸背记住。</p>\n<p>&quot;重复构型。&quot;他抬头，&quot;不同的人，做同一样的梦？&quot;</p>\n<p>&quot;同一个局部。概率上不该出现。&quot;</p>\n<p>&quot;查出原因了吗？&quot;</p>\n<p>&quot;还没有。&quot;</p>\n<p>&quot;那我换个说法。&quot;他把材料合上，&quot;三十七个人的数据，你永远查不出来。给我十万台设备，两周之内，数据多到把它淹出来。你们科学家总把异常当敌人。在我这儿，异常叫需求。&quot;</p>\n<p>&quot;有些异常是病。病因没查清就上市，不叫需求，叫投毒。&quot;</p>\n<p>&quot;再往深一步想。&quot;郑北辰用两根手指在空气里比了个取景框，&quot;如果不同的脑子会做同一个梦，梦就可以标准化。能标准化的东西才能复制，能复制的东西才能连锁。你们管这叫异常，我管这叫产品原型。&quot;</p>\n<p>会议室静了几秒。阳光挪了一格，把郑北辰的半张脸移出光里。</p>\n<p>&quot;还有一条，得写进合同。&quot;陆离说，&quot;所有梦境数据的所有权归研究所，蜃楼集团只有使用权。&quot;</p>\n<p>&quot;数据当然归你们。&quot;郑北辰同意得毫不迟疑，快得像一句早已写好的台词，&quot;我们只要优先查阅权。陆教授，这个年代，数据放在谁手里不重要——重要的是谁看得见。&quot;</p>\n<p>&quot;批文的事你也别操心。&quot;他忽然又说，&quot;三个月之内会下来。&quot;</p>\n<p>&quot;排队名单上有十四家。你怎么知道？&quot;</p>\n<p>&quot;我不知道。&quot;他整了整袖扣，&quot;我只是知道它会。这两者之间的差别，值四个亿。&quot;</p>\n<p>郑北辰往椅背上一靠：&quot;我父亲当年在康复医院躺了四年。第四年冬天，是我签的字。&quot;他说得很平，像念别人的病历，&quot;从那以后我就想，要是那时候有一台机器，能走进去找到他——哪怕只看一眼他在哪儿，告诉他儿子来了。&quot;他停住，摆摆手，&quot;抱歉，跑题了。价格回头谈。&quot;</p>\n<p>陆离分不清这个故事是真是假。它太完整了，完整得像谈判工具箱里一件用旧的工具，边角磨得发亮。真正的悲伤是带杂音的：会跑题，会突然停住，会在第四个冬天之外记得别的冬天。这一个没有。</p>\n<p>散会前，郑北辰提出最后一件事：新园区在建的研究中心，董事会希望命名为&quot;顾一凡中心&quot;。</p>\n<p>&quot;以死人的名字立一块牌子，对活着的人是个提醒。&quot;他说。</p>\n<p>陆离的眼前晃过一张旧工牌的背面，一行手译的文言，逢人就展示。——他梦见自己是蝴蝶。</p>\n<p>&quot;顾老师不在了，名字留下，楼里做的事变了，那是糟蹋。&quot;</p>\n<p>&quot;那你更该抓紧把商用做起来。&quot;郑北辰起身扣上西装扣子，&quot;楼盖好了，总得配得上它的名字。&quot;</p>\n<p>走到门口，他又停下，像忽然想起一件小事：&quot;听说第十四层有个特护病房？&quot;</p>\n<p>陆离的背绷紧了一瞬。&quot;家属要求的。按规定她有权住在治疗楼层。&quot;</p>\n<p>&quot;没人要赶她走。&quot;郑北辰回头看了他两秒，&quot;我是问，探视方便吗？&quot;</p>\n<p>&quot;方便。&quot;</p>\n<p>&quot;那就好。&quot;他走了。皮鞋声在走廊里均匀远去，像一台走时很准的钟。</p>\n<p>陆离在原地站了很久，才想明白哪里不对劲。</p>\n<p>整整五十分钟，这个人问了成本，问了周期，问了批文，甚至问了他的病房，每一个问题都像验尸报告一样精确。唯独没有问那句所有投资人都会问的话。</p>\n<p>他没有问：万一失败了呢。</p>\n<p>好像结局对他而言不是一个需要担心的未知数，而是日程表上早已翻过去的一页。</p>\n<p>电梯门合上前的一瞬，陆离看见他对着轿厢壁抛了一样东西，又接住——一枚被摩挲得发亮的旧硬币，图案磨平了，看不出面额。整个过程不到两秒，熟练得像一个比语言更旧的习惯。</p>\n<hr>\n<p>主治医师老周是在电梯口拦住他的。</p>\n<p>&quot;03号的事，你怎么解释？&quot;平板转过来，&quot;静息心率下降，深度睡眠占比上升，应激反射改善——三项同时变好，昨晚却没有任何治疗变更。三项同时变，就不是波动，是事件。&quot;</p>\n<p>他把平板往陆离面前又推了一寸。&quot;还有11号，车祸卧床两年那位，静息心率一周降了两格。今天早上，19号的主治也来问了同样的问题。三天，三个人。你要我在病历里继续写&#x27;波动&#x27;吗？&quot;</p>\n<p>&quot;自发恢复也有平台期之后的跃迁。文献里有。&quot;</p>\n<p>&quot;文献里也有原因。&quot;老周盯着他，五十岁的人，白大褂洗得发青，&quot;你最近是不是对她做过什么？&quot;</p>\n<p>&quot;没有。&quot;陆离说。这是本周他对同事说的第一个谎。他数着。</p>\n<p>&quot;那我在病历里写&#x27;原因待查&#x27;。&quot;</p>\n<p>&quot;应该写。&quot;陆离说。</p>\n<p>老周叫住了他：&quot;陆离。&quot;这是老周第一次不叫他陆教授。&quot;不管你在做什么，哪天想收步的时候，先来找我。我是医生，不是警察。&quot;</p>\n<p>陆离点了点头。走开的时候，负罪感像鞋里的一粒沙，不硌脚，但每一步都在。</p>\n<p>回到办公室，他做的第一件事不是拟答复，而是调数据。三十七位病人的周报曲线在屏幕上铺开，像一片安静生长的梯田。他把最近两周单独框出来：03号、11号、19号——改善的起点各不相同，却在同一条看不见的斜率上爬升。他往里叠加变量找相关：会话时长，无关；注入功率，无关；用药变更，无关。</p>\n<p>三条曲线开始爬坡的那几个深夜，生成器日志里只有一项指标同步动过：渲染负载，轻微上升。</p>\n<p>像很多人，同时在看同一个东西。</p>\n<p>下午四点，他去看了林晚。第九十八天。</p>\n<p>床上的她和昨天一模一样：呼吸起伏，眉目安静，左手摊在被面上，指甲修得很短。而梦里那只五指张开按在玻璃上的手还烙在他的视网膜上——同样一只手，一只什么也没按住，一只按住了他整个世界。</p>\n<p>他坐下，先做每天的那件事：把保湿霜一点一点涂在她的指节上。霜很凉。他把白天的事挑着讲了几件——食堂的糖醋排骨换了新配方，不如从前；楼下最后一树玉兰也谢干净了。讲到上午来了客人，他停了一下，把那个名字咽了回去，改口说：来了个人，谈生意，不太愉快。</p>\n<p>有些名字不适合带进这间病房，正如有些问题不适合带出实验室。</p>\n<p>&quot;再等等我。&quot;他对她说。这句话没有主语，也没有宾语，但他知道她听得懂——如果她还听得懂的话。</p>\n<p>离开前，他没有立刻开灯。黑暗里，监护仪的绿光一明一暗，把她左手腕内侧那道浅白色的新月形旧疤照得很淡。等他起身时，他在心里数了数：今天坐了十二分钟。</p>\n<p>比昨天多一分钟。他说不清多出来的这一分钟是给她的，还是给他自己的。</p>", "vol": "卷一 · 蜃楼"}, {"title": "第3章：叠影", "html": "<p>晚上九点二十，办公室的门被敲了两下，没等回应就开了。全所只有一个人敢这样敲门。</p>\n<p>小满，博士生二年级，二十五岁，白大褂袖口永远卷到手肘，工牌照片还是本科入学时拍的，那时候她有刘海。</p>\n<p>&quot;陆老师，我可能闯祸了，也可能中了头彩。您先说想听哪个。&quot;</p>\n<p>&quot;一起说。&quot;</p>\n<p>&quot;那我按时间顺序说。&quot;她把笔记本电脑架上桌，&quot;上周您让我把三年的会话数据整理成毕业论文附录。整理着整理着我想，光列表没意思，不如给画面聚个类——把每个人梦境流里的视觉特征降维、归类，看看每个人到底都梦见些什么。结果算法一直报错。您猜报的什么错？&#x27;检测到重复输入，请核对数据源&#x27;。我以为程序坏了，重写了一宿。程序没坏。&quot;她顿了顿，&quot;坏的是我的常识。&quot;</p>\n<p>屏幕上是一张叠合图。二十九道弧线摞在一起，粗细不一，轮廓几乎重合，像同一支笔描了二十九遍。</p>\n<p>&quot;三十七个人里，二十九个人的梦境流里出现过同一个东西。&quot;小满指着图，&quot;一道单拱的长弧，跨度占整个视野六成以上，悬在雾里。我不信邪，换了三种聚类方法重跑，删掉噪点最重的样本再跑，把生成器的默认贴图全部剔除以后又跑了一遍——二十九份抠出来对齐，轮廓误差还是不超过百分之三。&quot;</p>\n<p>&quot;会不会是场景库的问题？&quot;</p>\n<p>&quot;我查了素材索引。&#x27;单拱&#x27;加&#x27;浓雾&#x27;的组合，检索结果是零。这座桥不在素材库里，陆老师。它不是从哪儿调出来的——它是被画出来的。桥下没有水。我逐帧看过：没有河，没有谷，没有引桥。它就架在雾上，不知道通向哪儿。&quot;她翻到下一页，折线图陡然翘尾，&quot;频率也在涨。三个月前，平均每人每周出现一次；现在是每晚。最近两周，有几个人梦境流的片尾，它出现的时间超过了整场梦的一半。&quot;</p>\n<p>陆离站着没动。他知道下一句是什么，还是让她说完。</p>\n<p>&quot;最早的一次是什么时候？&quot;</p>\n<p>&quot;三年前，第七位受试者。项目刚开始那批。&quot;小满顿了一下，&quot;顾老师还在的时候。那条记录是我从备份磁带里扒出来的——三年前系统迁移，早期的会话流没进新库，我在仓库里翻了两天标签才对上号。&quot;她有点得意，随即压低了声音，&quot;陆老师，最早的那一次，桥就在。临床批开机的第一个月，它就在了。&quot;</p>\n<p>办公室很安静，空调的风声忽然显得很响。</p>\n<p>&quot;还有更怪的。&quot;她说，&quot;醒来的九位，我挨个回访过，全都否认见过什么桥。有一位阿姨，跟我聊了半个钟头孙子孙女，临出门忽然拉住我问：小满老师，你说人为什么总要过桥呢？我愣在原地——我从头到尾没提过一个桥字。&quot;她调出一排旧日志的截图，&quot;可我翻了他们的记录：其中六位，醒来之前的梦境流里有它。记录里有，记忆里没有。这东西好像只给睡着的人看，一睁眼就作废。&quot;</p>\n<p>她合上电脑，语速慢下来——这是她的习惯，先甩数据，再讲道理：</p>\n<p>&quot;按理说不该这样。梦的素材来自个人记忆，每个人走过的桥不一样：石拱桥、木板桥、过街天桥、立交桥。就算都梦见拱形的，弧度、栏杆、雾也该各画各样。可这二十九个人，画的是同一道弧，误差百分之三。我列了三种解释。第一，数据污染，场景库互相串——刚才说了，库里根本没这座桥，排除。第二，机器自己的毛病：渲染模块长出了一块集体缓存，所有人共用一张画布。&quot;她摇头，&quot;缓存能解释重复，解释不了构图。二十九个人，视角不同，焦距不同，连雾的浓度都跟着各自的深度感知变，可弧线就是那一条。重复的是数据，一致的是审美。审美不出自缓存。&quot;</p>\n<p>&quot;那第三种呢？&quot;陆离听见自己问。</p>\n<p>&quot;第三种我不敢说出口。&quot;小满看着他，&quot;那就是字面意思：有什么东西，正在把这同一座桥，发给所有人看。&quot;</p>\n<p>发给他们看的。陆离在心里把这六个字过了一遍。</p>\n<p>小满收拾电脑的时候，忽然回过头：&quot;对了陆老师，您天天看别人的梦。您自己呢？您梦见过它吗？&quot;</p>\n<p>顶灯的镇流器嗡了一声，很轻。</p>\n<p>&quot;没有。&quot;陆离说。</p>\n<p>这是本周第二个谎。</p>\n<p>&quot;哦。&quot;小满抱起电脑走到门口，又回头补了一句，&quot;要是哪天您梦见了，麻烦告诉我一声。这发现该署我的名——第一作者，通讯写您。我先谢谢您。&quot;</p>\n<p>门关上了。</p>\n<p>陆离在原地站了很久。然后他做了一件可笑的事：拿起平板上的触控笔，凭记忆把童年梦里那座桥画了下来。单拱，白色，雾，无水。他把这张潦草的图叠进小满的合图中，与那二十九道弧线放在一起配准。</p>\n<p>误差百分之二点四。</p>\n<p>比他们的平均值还小。</p>\n<p>他又看了一遍那张频率曲线。抬头的那一周，在三个月前。那个月他还做过另一件事：零号舱的例行基线校准。扫描对象一栏，写着他的名字。</p>\n<hr>\n<p>陆离在办公室坐到十一点。</p>\n<p>他在想那个词：发给他们看的。梦里的一切都由蜃楼的生成器实时渲染——场景是生成的，人物是合成的，每一帧理论上都是机器的作品。如果桥是被&quot;发下去&quot;的，发送方只有一个：蜃楼自己。</p>\n<p>可蜃楼为什么要给二十九个互不相识的病人，反复放映同一座不存在的桥？</p>\n<p>他试着替机器辩护。注入流依赖病人皮层里残存的记忆碎片重组，而记忆里谁没有几座桥呢？可是没有人见过架在雾上、两头悬空、桥下无水的桥——现实里没有原型，记忆里就没有种子。种子都不存在的植物，却在二十九个脑子里开了同一朵花。</p>\n<p>还有一个更不舒服的问题。如果是&quot;发给&quot;，那么收件人是谁并不重要，重要的是：发件的人认为，他们应该看见什么。</p>\n<p>他调出第七位受试者的档案。三年前的会话，画质更糙，噪点更重。他把进度条拖到末端：昏黄的雾里，那道淡白色的长弧安安静静地立着，跨过看不见的两端——和昨晚在他屏幕上烧掉的那一格，分毫不差。</p>\n<p>会话记录的操作人签名栏，一水儿是同一个名字：顾一凡。项目头一年临床序列还没建全，基线校准都由首席亲自做。他又调出顾一凡自己的校准日志——按规程，首席也要定期用自己的神经信号给零号舱做基准，就像他自己三个月前做过的那样。这份日志比临床批老得多：还在旧楼里对着原型机做验证的年代，蜃楼没有一个病人，首席能拿来给机器做基准的，只有他自己的脑子。</p>\n<p>顾一凡的自体记录，头一年的备注栏都是空的，和所有人的日志一样。第十四个月，出现了第一句：&quot;今日见弧。&quot;此后每隔几周一条，越来越短，也越来越密：&quot;弧度偏北。&quot;&quot;跨度在长。&quot;&quot;雾薄了。&quot;最后一条，日期是三年前的十一月七号，夜里十一点四十一分：</p>\n<p>&quot;又清晰了。&quot;</p>\n<p>第二天天亮之前，人们发现顾一凡从旧楼的顶层坠了下去。警方结论是意外；楼梯的扶手确实锈了。</p>\n<p>陆离去看过那个楼梯间。锈是慢东西，要很多年才爬满一根扶手。三年前的那个早晨它就已经锈成了那样——这个念头当年从没有人深究过，现在它自己走了回来。</p>\n<p>原来他早就见过它。不止一次。他一直在给它做记号，像给一头不肯露面的野兽量脚印。然后他死了，死因写的是意外。</p>\n<p>有些事陆离也从没对人讲过。讲了也没有意义——这句话，他最近用得越来越熟了。</p>\n<p>十一岁那年，母亲住院，他在县医院的走廊里蹲了一个夏天。绿色墙裙，水磨石地面，消毒水味渗进作业本的纸页里，护士站的姐姐们都认得这个蹲在长椅边写作业的孩子。那年秋天，他第一次梦见一座桥：单拱，白色，悬在雾里，桥下没有水。他在桥头站了一整夜，不敢上去。此后近三十年，他只见过它三次：两次在自己的梦里——童年一次，顾一凡坠楼当夜一次，当时他只当那是悲伤借来的意象；第三次在别人的梦里——昨晚，它在林晚梦境的最后一帧上一闪而过。今晚，他把那段被保护性中止掐断的录像逐帧回放，才终于看清：桥面上有一行极小的字，小得像刻给蚂蚁看的。间隔越来越短，桥越来越清晰。</p>\n<p>这件事他只对一个人讲过。很多年前的一个晚上，林晚听完，很久没有说话，最后问了一句：那你后来上去过吗？</p>\n<p>他没有上去。三十年里，他一直站在桥头。</p>\n<p>林晚那天晚上还有后半句话，被一列进站的地铁吃掉了。这些年他偶尔想起来，猜过无数种下半句，每一种都通向一个他没敢走的路口。</p>\n<p>他看不清桥面上那行字写了什么。但他知道那不是幻觉——幻觉不会三十年不换布景。</p>\n<p>窗外，晚高峰的车流在高架上拉出连绵的光带，一道一道，全是弧。这座城市到处是桥。人人在桥上走，去往各自以为的目的地。</p>\n<p>陆离关掉屏幕。明天是理事会答辩，后天是新一批治疗会话。都不要紧。</p>\n<p>要紧的是今晚。他拿起手机，给小满发了条消息：&quot;明天的理事会答辩，帮我盯着第七位受试者全部原始流的调阅权限。&quot;对方秒回一个&quot;好&quot;，隔了几秒，又追来一句：&quot;陆老师，您梦到它了，对不对？&quot;</p>\n<p>他没有回。</p>\n<p>凌晨零点四十，他下了楼，用首席权限打开第十四层的观察间。先经过特护病房：监护仪的绿光隔着玻璃一明一暗，她在睡，或者在她的那个世界里走着。他在门口停了三秒钟，像每次实验前核对参数一样，把这三秒钟记进心里。</p>\n<p>然后是零号舱。王冠扣上来，导电凝胶凉得像春夜的雨水。注入对象一栏，他把&quot;林晚&quot;改成了&quot;陆离&quot;。健康人自体注入不在任何一份批准文件里——就像三个月前的那个雨夜一样，他想，规矩是用来描述常规的，而他做的从来不是常规的事。</p>\n<p>要去看的东西在桥的那一头。</p>\n<p>这一次，不做旁观者。</p>", "vol": "卷一 · 蜃楼"}, {"title": "第4章：桥", "html": "<p>注入程序启动需要七秒。</p>\n<p>三年来，陆离执行过几百次这套流程，每一次，他都在玻璃的这一侧。今晚观察间的灯没有开，屏幕黑着，椅子空着——那个始终坐在&quot;做梦的人&quot;外侧的位置，第一次空了出来。链路像一条隧道，从前总有人在洞口举着灯；今晚灯灭了，隧道两头连成了一体。</p>\n<p>王冠上的一百二十八组感应环开始工作，头皮上有极轻的麻，像雪落在雪上。他躺平，把呼吸放慢。注入功率停在安全下限的三分之一——给她的参数，他没有改。改了，这就不是一场探望，是一次闯入。顺手，他还把保护性中止的阈值抬到了临床禁区以外：三天前，就是这道保险把林晚的第一次会话拦腰掐断的。今晚，他不打算被任何警报请出去。</p>\n<p>睡意不是涌上来的，是退下去的。先是空调的风声退了，然后是背板的硬度、膝盖的微曲、&quot;躺&quot;这个概念本身。工程师的习惯撑到最后：他在心里数自己的呼吸，像给系统挂一个测量点。数到第九下，呼吸也退了潮——不是停了，是这件事被交给了别人代办。</p>\n<p>黑暗里剩下的最后一样东西，是一条走廊。</p>\n<p>绿色墙裙。水磨石地面。消毒水的气味渗在墙皮里，混着一点作业本纸页的味道。他不用看门牌就知道这是哪条走廊——三十年前，他趴在那张长椅上写暑假作业，护士站的姐姐们轮流拿他的钢笔盖打趣。这条走廊是他的。这一次，理直气壮。</p>\n<p>走廊尽头没有玻璃门，是一扇纱窗木门，合页锈了，推开时灌进来一整个夏天的蝉声——然后蝉声也退了潮。</p>\n<p>门外没有楼道，没有天空。是雾。</p>\n<p>雾里升着那座桥。</p>\n<p>单拱，白色的长弧，从脚前十步的地方升起，跨进雾的深处，两端都看不见落点。桥下没有水——不是干涸的那种干，是&quot;下面&quot;这个方向本身被雾收走了。二十九个人的合图，轮廓误差百分之三，这张图他看过不下两百遍。可图纸没有准备好迎接它真正的尺度：桥升起来的那段弧，比任何一张叠图都陡，都高，高得让&quot;跨度占视野六成&quot;这种度量失去了意义。</p>\n<p>他迈上第一级台阶。石面凉，颗粒细，硌着鞋底。他忽然停住——这个手感他认识。水磨石。和走廊的地板，和他十一岁那年趴过的地面，是同一种石头。</p>\n<p>桥是从他脑子里长出来的。或者，他的脑子是从桥上拆下来的。他甩掉这个念头，往桥心走。</p>\n<p>字在桥心。</p>\n<p>他先看见的不是字，是一片几乎看不出的凹凸。走近，蹲下，把视线压到几乎贴上石面，它才显形为一行字——横排，极小，小得像刻给蚂蚁看的。他认得每一个字。可它们排在一起，就成了读不进去的东西：目光扫过去，意思像水从指缝里漏光，一行字读了十几遍，脑子里只剩&quot;读过了&quot;这个空壳。像一句用睡意写成的话。</p>\n<p>他伸出手指去描。石面上没有刻痕。可那些笔画里分明嵌着灰——像有人用针尖蘸着雾写的，写一笔，是一笔。</p>\n<p>身后有人说：</p>\n<p>&quot;别数层数，数铜钱。&quot;</p>\n<p>声音不大，像在会议室里顺手纠正一处口误。</p>\n<p>他回过头。雾向两边让开一条窄路，顾一凡站在窄路的尽头，白大褂洗得发白，胸前的工牌反着挂，露出背面一行瘦长的钢笔字，逢人就展示过的那种笔迹：</p>\n<p>——他梦见自己是蝴蝶。</p>\n<p>&quot;顾老师。&quot;陆离听见自己说。这个名字三年里只出现在档案签名栏和立项书扉页上，出口的一瞬间他才发现，它一直是活的。</p>\n<p>&quot;嗯。&quot;顾一凡应得像在所里的走廊里偶遇。他侧头看了看脚下的雾，又看了看陆离，&quot;你迟到了。&quot;</p>\n<p>&quot;三年。&quot;</p>\n<p>&quot;三年零一个冬天。&quot;顾一凡说，&quot;我在桥上等得更久。&quot;</p>\n<p>&quot;您……&quot;他不知道该怎么问。三年的悼词措辞在这一刻全部作废。</p>\n<p>&quot;我死了。&quot;顾一凡替他把话说完，语气平稳得像报一组实验数据，&quot;你现在看见的，也许是鬼魂，也许是蜃楼的生成模型，也许是这座桥随手借给我的一件旧衣服。你自己挑一个信得过的。&quot;</p>\n<p>&quot;科学上没有信得过的选项。&quot;</p>\n<p>&quot;所以才好玩。&quot;顾一凡笑了，笑纹里没有一点责怪的意思，&quot;我挑不出来。挑不出来，就只好站在这儿，等你来挑。&quot;</p>\n<p>陆离往前走了一步。他是带着问题来的，问题在喉咙里排着队。他挑了最前面的那个：</p>\n<p>&quot;上面还有东西，对不对？我们是在做梦——这一层是梦。那梦里的人，能不能走到梦的外面去？&quot;</p>\n<p>顾一凡不答，反问：&quot;你数过这座桥有多长吗？&quot;</p>\n<p>&quot;没有。&quot;</p>\n<p>&quot;为什么不数？&quot;</p>\n<p>陆离想了想。&quot;数不完。再说，就算数完了，长度也不重要。&quot;他说，&quot;重要的是走。&quot;</p>\n<p>&quot;对喽。&quot;顾一凡一拍手，像给一道悬了很多年的证明题盖上最后一个章，&quot;别数层数。层数是说给怕高的人听的。数铜钱。&quot;</p>\n<p>他从白大褂的下口袋里摸出一样东西，抛过来。</p>\n<p>一枚铜钱。圆的，中间一方孔，边缘磨得溜圆，字和图案都没有了，只剩金属本身一层温润的光，像被一千只手先后盘过。很轻，比记忆里任何一枚钱都轻，轻得不像金属，像一个&quot;钱&quot;字。</p>\n<p>&quot;这是——&quot;</p>\n<p>&quot;门票，路标，存折。&quot;顾一凡说，&quot;叫什么都行。往后你会遇见很多人。别急着信他们对你说的话——到了该认识的时候，你自然会看他们的手。&quot;</p>\n<p>&quot;看手？&quot;</p>\n<p>&quot;手不会撒谎。&quot;顾一凡说，&quot;嘴会。&quot;</p>\n<p>然后他收起笑，凑近半步，压低声音，像交代无菌操作的最后一个步骤：</p>\n<p>&quot;记住。醒来以后，先摸它，再回忆这儿的事。顺序不能反。&quot;</p>\n<p>&quot;为什么？&quot;</p>\n<p>&quot;反了，&quot;顾一凡说，&quot;你就只剩它了。&quot;</p>\n<p>&quot;我还有一个问题。&quot;陆离听见自己的心跳。真正的问题来了，排在队尾攒了很久的那个。&quot;我妻子。她还在下面。第九十八天了。我想带她——&quot;</p>\n<p>顾一凡抬起一只手，止住了他。</p>\n<p>然后他做了一件让陆离此后许多年都无法向任何人描述的事。他凑得更近，近到陆离能看清他虹膜上的纹理；然后，看了进来——不是看着他，是顺着他瞳孔的正中，向最深、最里面看过去。</p>\n<p>陆离做了三年链路，他认识这个焦距。屏幕那头的林晚曾这样看过玻璃，望进她自己瞳孔的最深处——那条视线的尽头，坐着做梦的人。</p>\n<p>可这一次不一样。这一次，视点的主人就是他自己。他的眼睛后面没有屏幕，没有观察间，没有工程师，只有颅骨，和颅骨里一点四千克柔软的东西。顾一凡在往里看。再往里。</p>\n<p>&quot;你每天给她涂霜。&quot;顾一凡轻轻地说，&quot;先从小指涂起。&quot;</p>\n<p>雾里安静得能听见桥石收缩的细响。</p>\n<p>这个细节，陆离从没对任何人讲过。先涂小指，是因为小指最难沾匀，要先把它安顿好。连林晚自己都不知道，她每天是被从小指开始安顿的。</p>\n<p>&quot;您都看见什么了？&quot;他哑着嗓子问。</p>\n<p>顾一凡退开半步，恢复了平常的声调，仿佛刚才只是俯身看了一眼显微镜。</p>\n<p>&quot;我什么也没看见。&quot;他说，&quot;是那些东西从你眼睛里路过。我站得够久，只是数清了趟数。&quot;</p>\n<p>雾动了。</p>\n<p>不是风。是桥下的方向亮了——浓雾深处缓缓浮出一片光的轮廓：楼群，高架，一整座南方城市的夜天际线，灯火通明，安安静静悬在无水的雾海之下，像倒着生长的一片星空。</p>\n<p>&quot;你带来的。&quot;顾一凡朝那片光抬了抬下巴，眉头皱起来，&quot;你惦记的东西太重，把底下压漏了。&quot;</p>\n<p>光斑开始向上渗，雾一缕一缕变薄，桥身的白色发暗——不是被遮住的暗，是熄灭的暗，一格，又一格，从看不见的两端向中间收拢，像有人从两边拉闸。</p>\n<p>&quot;走吧。&quot;顾一凡说，&quot;攥紧钱。别回头。&quot;</p>\n<p>陆离把钱攥进掌心，棱角硌着掌纹。他转身走了三步，到底还是违了最后一次嘱咐，回了头——</p>\n<p>顾一凡立在仅剩的一段亮着的桥面上，越来越小，抬起手挥了挥，从容得像只是送一位改天再见的朋友。最后熄灭的是那块反挂的工牌，一行瘦长的字没入黑暗：</p>\n<p>他梦见自己是蝴蝶。</p>\n<hr>\n<p>陆离睁开眼。观察间的天花板惨白，通风口的指示灯一绿一灭。</p>\n<p>心率很快。他躺着喘了一会儿，全身的肌肉在细微地抽，像刚从很深的水里被拽上来。导电凝胶已经在头皮上干了大半。</p>\n<p>先摸它——</p>\n<p>他想起来了。来不及了。正因为它来得不够快，他清清楚楚地看着那些东西离开他：先是声音。顾一凡的声音没有了。一分钟前他还听着的那副声调，此刻无论怎么默诵，出来都是自己的嗓子在模仿，模仿得不像。然后是脸。他见过那张脸，刚才还隔着一尺看过虹膜的纹理，现在那张脸在记忆里糊成一团噪点，五官像被橡皮擦过，只剩&quot;见过&quot;这个事实站在原地。</p>\n<p>他在失去。不是失去之后才发现，是眼睁睁看着失去在进行。遗忘不是一个结果，是一个过程，有速度，有方向——正从他这里，往桥的方向搬东西。</p>\n<p>他翻身扑向工作台，抓过那支平时用来口述会话记录的录音笔，按下红键。</p>\n<p>&quot;桥。&quot;他听见自己说，声音陌生，喘，&quot;桥心有字。读不出。字都认识，读不出。顾……顾老师。他在。他说——他说……&quot;</p>\n<p>长长的空白，只有磁带般的沙沙声。他听着自己在水面上拼命地抓。</p>\n<p>&quot;……小指。&quot;最后他说，&quot;先涂小指。……钱。他给了我一枚钱。&quot;</p>\n<p>停了几秒。</p>\n<p>&quot;它在。&quot;他说，&quot;它还在。&quot;</p>\n<p>他这才摊开左手。</p>\n<p>掌心里躺着一枚铜钱。圆的，方孔，边缘磨得溜圆，没有字。金属的凉贴着皮肤，重量实实在在压在掌纹上。</p>\n<p>梦里的东西，此刻在梦的外面。</p>\n<p>天亮之前，他做完了一个工程师能做的一切。</p>\n<p>零号舱是校准设备，自体会话照例自动存档——顾一凡那些越来越短的备注，就是这样来的。此刻陆离忽然彻底读懂了它们。什么定期基准，什么观察笔记。今日见弧。弧度偏北。雾薄了。那不是科研记录，那是一个人在跟遗忘抢时间：趁还没忘干净，赶紧把看见的东西钉到纸上。一句比一句短，一条比一条密。</p>\n<p>最后一条是：又清晰了。</p>\n<p>他把进度条拖进会话中段。灰绿色的噪点里，桥出现了，比档案里任何一段都清晰。第一视角：桥面，石缝，雾。走到桥心，蹲下——画面下方伸进来一只手，他自己的手，指尖悬在一行字上方。</p>\n<p>然后画面猛地回转，晃了一下，稳住。顾一凡的脸占满半个屏幕，隔着三年的死亡和一层灰绿的噪点，看着镜头。</p>\n<p>看着他。</p>\n<p>陆离坐在屏幕前，一动不敢动。链路的几何学他比谁都清楚：画面里没有镜头，画面本身就是他的眼睛。前天夜里，林晚用同样的方式穿过玻璃看他；此刻，死者隔着一段录像，又一次顺着瞳孔向里看——看进屏幕外的这只眼睛里来。</p>\n<p>顾一凡的嘴唇在动。</p>\n<p>没有声音。链路从头到尾只读视觉皮层，从来没有录下过任何一个字。他看着那场交谈无声地进行下去——一只清瘦的手探进画面，把钱放进属于他的那只手里。整场谈话是一场哑剧，所有台词都锁在他正在漏空的脑子里。</p>\n<p>他调出另一条曲线：PCI。</p>\n<p>这台机器不会数人数。它只会报告一个脑子醒得有多彻底——0.31以下是石头；越过0.44，房间里有人。三年来单次会话的最高纪录是0.51，属于林晚：她在玻璃里认出他的这一瞬。</p>\n<p>他的曲线越过了它。不是像她那样一步跳过去、随即被保险切断——而是从顾一凡开口的那一刻起，一路缓缓爬升，稳稳停在0.63，直到桥熄灭才落下来。一整块高原，横贯整场谈话。</p>\n<p>房间里的&quot;有人&quot;，如今不止一位了。</p>\n<p>再看渲染负载，他愣住了。</p>\n<p>按行情，这场梦本该是一次陡峭的高峰：雾要一层一层地算，桥的弧面要一块一块地补，画面越复杂，通道上的读数就该爬得越高。可实际的曲线恰恰相反——他在桥上走得越深，桥变得越清晰，负载反而一路下滑，低到几乎贴着基线。</p>\n<p>清晰度和负载，成了一对反比。</p>\n<p>只有一种解释说得通：那些画面不是机器画出来的。机器只是没拦着——有什么东西从这里路过，它让开道，任由其显了形。</p>\n<p>清晨六点半，医疗AI的例行报告准时抵达：03号，林晚，深度睡眠占比较前一日再升6%，应激反射进一步改善。结论栏依旧写着：原因不明，建议复查。改善的时间戳落在凌晨零点五十一分——他在桥上的时刻。</p>\n<p>他把手机翻扣在桌上，洗脸，刮胡子，换上一件熨得平整的白衬衫。铜钱从掌心移进右边的裤袋。九点整，理事会答辩。昨夜之前准备的材料还在公文包里，四十页幻灯片，每一页都精确得像手术台。此刻它们显得无比安全：那是一个有层数的世界，一层一层，数得清楚。</p>\n<p>出门前他看了一眼手机。小满凌晨两点五十七分发来一条消息，只有三个字：</p>\n<p>&quot;睡了么？&quot;</p>\n<p>他没有回。</p>\n<p>电梯下行。轿厢里只有他一个人，金属门上映着他变形的倒影。他的右手无意识地伸进裤袋，捏住那枚钱，拇指一推——</p>\n<p>钱贴着指缝翻了个身，稳稳落回掌心。</p>\n<p>整套动作流畅、圆润、熟极而流，像一个比语言更旧的习惯。</p>\n<p>陆离僵在原地，盯着掌心里那枚磨平了字的钱。</p>\n<p>这不是他的动作。这个动作属于昨天中午，电梯合拢前一瞬，另一位先生的手腕。</p>\n<p>电梯到了。门开了。八点五十分的大厅人来人往，每个人行色匆匆，每一只手都插在自己温暖的口袋里。</p>\n<p>他把手也插了进去，握紧那枚钱，走进人群。</p>", "vol": "卷一 · 蜃楼"}, {"title": "第5章：铜钱", "html": "<p>理事会的会议室在第三十二层，比郑北辰的四十层低八层，采光却好得多——整面东墙的落地窗，正午的阳光把长桌照成一块浅色的砧板。陆离站在桌头，把四十页幻灯片按序讲完，用时二十六分钟，比预定短四分钟。</p>\n<p>有理事问起生成器异常的进展。他说，专案组在查。这不算撒谎：专案组确实存在，目前全部成员是他和一个博士二年级学生。</p>\n<p>表决环节没有悬念。二期扩建，四个亿，全票通过。掌声响起来的时候，他的右手在裤袋里，拇指压着那枚钱的方孔。钱是温的——被体温焐了半天，像一小块活物。</p>\n<p>散会时人流向门口涌。郑北辰从末排起身，没有过来道贺，只在经过时停了半步，抬起手腕看了一眼表。</p>\n<p>就这一眼。</p>\n<p>袖口滑落一寸，露出腕骨内侧一小块皮肤：浅色的，一道弯弯的旧痕，像一个没盖好的邮戳。四米远，不到一秒，然后袖口回落，表盘合拢，郑北辰随着人流走出会议室，自始至终没有朝陆离的方向多转一次头。</p>\n<p>陆离在原地站了很久。清洁工开始收杯子，他才想起来自己的呼吸停在哪一格。</p>\n<p>看他们的手。顾一凡说，到了该认识的时候，你自然会看他们的手。</p>\n<p>他看了。他也认识了。</p>\n<hr>\n<p>上午十点，小满抱着笔记本电脑进来，脸上是熬了通宵的人特有的那种又亢又木的表情。</p>\n<p>&quot;您凌晨没回我消息。&quot;她说，&quot;我就当您默许了。&quot;</p>\n<p>&quot;默许什么？&quot;</p>\n<p>&quot;默许我加班。&quot;她把电脑架上桌，翻开，&quot;您让我盯第七位受试者的调阅权限，我盯了。原始流我全量拷出来了，昨晚跑完基线比对——这部分是正经工作，写进论文没问题。&quot;她顿了顿，翻到下一页，&quot;然后我干了点不正经的。&quot;</p>\n<p>屏幕上是一张世界地图，撒满了图钉。</p>\n<p>&quot;桥。&quot;她说，&quot;我把&#x27;白桥&#x27;、&#x27;雾里的拱桥&#x27;、&#x27;梦见一座不存在的桥&#x27;这些关键词，拿去做全网图像和文本检索，中英文都做了，时间范围拉到三十年。正经论文里没人写过这种东西，但是——&quot;她的指尖划过那些图钉，&quot;博客有。贴吧有。树洞有。遗书有。最早的一篇是一九九八年某个个人主页的留言板，扫描上去的胶片照片，配文是&#x27;我爷爷走后留下的梦，我一直不敢删&#x27;。&quot;</p>\n<p>三十一条帖子。发帖人分布在九个国家。有人当灵异故事讲，有人当心理创伤讲，有个荷兰人管它叫&quot;我的重复出现的梦&quot;，附了一张自己画的素描——单拱，白色，悬在雾里，桥下无水。误差多少不必算了，小满把它叠进那二十九人的合图里，弧线咬合得像同一支笔描的第三十一遍。</p>\n<p>&quot;这还不是重点。&quot;她翻页，&quot;重点是评论区。&quot;</p>\n<p>评论区里有种奇特的引力：每一条讲桥的帖子下面，迟早会漂来不相干的留言，说自己没梦见过什么桥，但是家里有一枚老钱，奶奶说是传家的，睡觉要攥在手心，不能离身。第一条这样的留言出现时小满没在意；第七条出现时她改了检索词。</p>\n<p>新的一页幻灯片上，是一枚钱的特写，和它背后密密麻麻的缩略图墙。</p>\n<p>&quot;全网可检索的同款钱，三百四十七张清晰照片，模糊的不算。形制完全一致：圆，方孔，磨平，无字。分布——&quot;她切换到地图，新的图钉层铺开来，密度是桥的三倍，&quot;二十三个国家和地区。最早的实物照片一九九八年，最晚的上个月。有个收藏论坛做过不完全统计，加上只发文字描述的，全球至少一千三百人持有。&quot;</p>\n<p>&quot;他们怎么说这个钱的来历？&quot;</p>\n<p>&quot;说什么的都有。庙里求的，地里刨的，祖上传的，梦里一个白胡子老头给的。&quot;小满调出一页关键词云，&quot;&#x27;护身符&#x27;&#x27;传家&#x27;&#x27;不能离身&#x27;是高频词，但是出现频率最高的一条短语是这个——&quot;她放大，五个字被红框圈住：</p>\n<p>攥着它睡觉。</p>\n<p>&quot;一千三百个人，互不相识，隔着几十年和半个地球，家里都流传同一句没头没尾的话：睡觉的时候，要攥着它。&quot;小满说，&quot;陆老师，民俗不是这么长的。民俗要有故事，有神，有因果。这个没有。它只有一句操作说明。&quot;</p>\n<p>办公室里安静了几秒。顶灯的镇流器嗡了一声。</p>\n<p>&quot;还有手。&quot;她的声音低下去，翻到下一页，&quot;能看清手腕的照片，一共一百一十二张。其中六十九张——六成多——持币人的手腕内侧，有一道浅色的月牙形痕迹。我一开始以为是表带印或者胎记，后来把这六十九张全部放大，摆在一起。&quot;</p>\n<p>屏幕上，六十九个手腕排成一个方阵。六十九弯月牙，深浅不一，角度各异，形状分毫不差。</p>\n<p>&quot;同一个模子里倒出来的月亮。&quot;小满说，&quot;我给这页起了个名字，就叫《手》。&quot;</p>\n<p>陆离盯着那片月亮，很久没有说话。顾一凡的声音在他脑子里过了一遍：你自然会看他们的手。原来这句话不是说给他听的，是说给所有走到桥头的人听的。</p>\n<p>&quot;最后一页。&quot;小满说。</p>\n<p>最后一页几乎是空的。正中央一行字：</p>\n<p>我们是不是都拿着同一张门票？</p>\n<p>陆离的后颈麻了一下。&quot;门票&quot;这个词，他昨天凌晨才听过，在一座别人看不见的桥上。世界上不该有第二个人知道。</p>\n<p>&quot;为什么用这个词？&quot;他尽量让声音平稳。</p>\n<p>&quot;不知道，&quot;小满耸耸肩，&quot;写的时候自己蹦出来的。您看，连我都开始说梦话了——所以，陆老师，署名的事先放放。我现在只想知道一件事：它到底是什么？&quot;</p>\n<p>陆离看着她。二十五岁，白大褂袖口卷到手肘，眼睛里烧着一种他熟悉的东西——三年前，另一个人在立项书扉页上印《庄子》的时候，眼睛里就是这种火。</p>\n<p>他做了一个决定。后来他很多次回想这个瞬间，都没能确定它是正确的一步，还是错误的第一步。</p>\n<p>&quot;下午三点，行政处。&quot;他说，&quot;跟我去取一样东西。&quot;</p>\n<hr>\n<p>顾一凡的私人遗物封存在行政处地下室的铁皮柜里，三年没有人动过。清单不长：几本书，一副眼镜，一件叠得整齐的白大褂，一个笔记本。第七项写着：古钱币一枚（随身遗物）。</p>\n<p>管理员戴上手套，从丝绒布包里取出它，放在托盘里。</p>\n<p>一枚铜钱。圆的，方孔，边缘磨得溜圆，没有字。它薄得吓人——常年的盘磨几乎吃掉了三分之一的厚度，对着灯举起来，方孔四周透出一圈毛茸茸的光晕，像一片快要用尽的月亮。</p>\n<p>小满倒吸了一口凉气，看看托盘，又看看陆离，嘴唇动了动，最终什么也没问。</p>\n<p>回办公室的路上，两个人都没说话。走到电梯口，小满忽然开口：&quot;陆老师，您的意思是……顾老师生前也有一枚？&quot;</p>\n<p>&quot;清单上是这么写的。&quot;</p>\n<p>&quot;那他是怎么跟一千三百个人认识的？&quot;</p>\n<p>陆离按下电梯。这个问题没法回答。他只能说：&quot;先做检测。&quot;</p>\n<p>下楼之前，他去管理科签了一份临时借用单，经手人一栏落了自己的名字。按规定，一周之内归还。</p>\n<p>检测是违规的，他清楚——所里的质谱仪排期公示在内网上，每一单都要留痕。他用的是材料组一台退役的老设备，报了个耗材测试的名目。结果在傍晚出来：黄铜，铜锌比例接近现代精密铸造的下限，铅锡微量元素的组合不属于中国历史上任何一个朝代的铸钱配方；表面磨损却是地地道道的自然盘磨，做不了假，按速率估算需要数百年；而方孔的边缘，又留着现代机床才铣得出的圆跳动公差。</p>\n<p>手工的时代，机床的孔。数百年的磨损，不该存在的合金。</p>\n<p>&quot;这枚钱在物理上不应该存在。&quot;小满盯着报告说。</p>\n<p>&quot;但它存在。&quot;</p>\n<p>&quot;那就只剩一种可能了。&quot;她抬起头，&quot;它存在的地方，物理跟我们这边不一样。&quot;</p>\n<p>陆离没有接话。窗外的天暗下来了，晚高峰的车流在高架上拉出光带，一道一道，全是弧。</p>\n<p>后来，那枚钱一直没有被归还。</p>\n<hr>\n<p>傍晚六点，他去了第十四层。</p>\n<p>林晚睡着，呼吸绵长。他坐下，做每天的那件事：保湿霜，指节，先从小指开始。他把白天的事挑着讲了几件——答辩通过了，食堂的糖醋排骨据说又要换回旧配方。讲到理事会，他停了一下：今天到场的有一位重要的客人。</p>\n<p>有些名字不适合带进这间病房。</p>\n<p>离开前他没有立刻开灯。黑暗里监护仪的绿光一明一灭。他在心里数着：今天坐了十三分钟。</p>\n<p>主治医师老周在走廊里等着他，白大褂洗得发青，手里捏着平板。</p>\n<p>&quot;第四个了。&quot;老周说，&quot;27号，昨晚开始的，心率、睡眠结构、应激反射，三项齐动。跟前三条曲线摞在一起看，像是约好的。病历上&#x27;原因待查&#x27;我已经写了四份。周五之前，陆教授，我要么收到你的解释，要么把这四页交给医务处。我是医生，不是警察——但医务处是。&quot;</p>\n<p>&quot;周五之前。&quot;陆离说。</p>\n<p>&quot;还有，&quot;老周在他背后补了一句，&quot;你最近气色很差。首席也是肉做的。&quot;</p>\n<hr>\n<p>夜里十一点，观察间。</p>\n<p>陆离锁上门，在水槽前站了一会儿，把两只手都洗干净，擦干。然后他对着镜子，卷起了左边衬衫的袖子。</p>\n<p>前臂内侧，腕骨上方，皮肤在暖光灯下泛着均匀的白。</p>\n<p>什么都没有。</p>\n<p>他又卷起右边的袖子。也没有。两截干净的手腕，像两面刚擦过的黑板，像两页从来没被写过的纸。</p>\n<p>他早就知道自己没有。四十一年，洗澡，体检，打球，握过的每一双手，从来没有谁提起过。这道题他其实做过，只是从来没用&quot;疤&quot;这个字眼出过题。直到今天，一千三百只手腕在他眼前排成方阵，他才第一次以核对的态度，把自己的两只手摊进这份名单里查了一遍。</p>\n<p>查完了。名单上没有他。</p>\n<p>她有。顾老师有。郑北辰有。那一千三百个攥着钱睡觉的人，人人都有。他上了桥，见了故人，带回一枚钱——他的手腕却干干净净。</p>\n<p>陆离放下袖子，看着镜子里那个眼下乌青的男人，忽然想起很多年前的一个傍晚，他握着一位姑娘的手第一次开玩笑：月亮总得落在一个人手上。</p>\n<p>那时他以为那是比喻。</p>\n<p>现在它是一份名单。月亮落在她手上，落在顾老师手上，落在一千三百只手上。</p>\n<p>他的两只手都空着。</p>", "vol": "卷一 · 蜃楼"}, {"title": "第6章：北辰", "html": "<p>二代机从下单到通电，只用了九天。</p>\n<p>首批五十套，白色头环，比一代轻一半，感应环从一百二十八组加密到三百组。工程部在发布邮件里用了三个感叹号介绍新特性：全皮层覆盖、实时渲染增强，以及——听觉通道。从此链路不但能看见梦，还能听见梦。理由写得理直气壮：家用版不能是一部哑片。</p>\n<p>伦理快审用了四十分钟。陆离在申请表的签字栏里落笔的时候，想起自己三个月前说过的话：病因没查清就上市，不叫需求，叫投毒。他反对过的每一件事都在排队等一个私心。</p>\n<p>现在私心来了。听觉反演意味着，有朝一日他能听见她说的话。</p>\n<p>他把名字签得一如既往地平稳。</p>\n<p>下午四点，他去看了林晚。第一百天。保湿霜，指节，先从小指开始。讲了两件事：新设备到了；食堂的糖醋排骨果然换回了旧配方。离开前他在黑暗里坐着，数到十四分钟才起身。</p>\n<p>比昨天多一分钟。他说不清这增长的计量往哪个方向去。</p>\n<p>傍晚，黑色轿车停在楼前。郑北辰的电话是半小时前打来的，只有一句：&quot;来看样东西。穿防静电鞋。&quot;</p>\n<hr>\n<p>车开出城区，在南郊的工业园里拐了三道弯。汽轮机的低频轰鸣隔着围墙传出来，像大地在打鼾。全国七座发电厂之一，郑北辰的商业帝国从这里起步——如今半个厂区改成了数据中心，集装箱式的机房列成方阵，蓝光在百叶格栅里明明灭灭，冷却塔的白汽笔直地升上黄昏的天空。</p>\n<p>正赶上换班，穿蓝色工装的工人从厂区大门涌出来，汇成一条迟缓的河。没有谁抬头看天。这里的黄昏二十年如一日：烟囱，白汽，准时亮起的灯。</p>\n<p>机房旁边有一片玻璃温室，里面种着番茄。陪同的工程师说，服务器余热供暖，一年出六茬。&quot;郑总说的，每一焦耳都不许浪费。&quot;</p>\n<p>核心机房里比想象中安静得多。风冷系统白噪如雨，脚下的防静电地板微微反光，人走在上面像走在一面浅湖上。三千块加速卡排成峡谷，指示灯的海一直铺进黑暗深处，热浪扑在脸上，混着一点臭氧和暖尘的味道。郑北辰站在峡谷尽头的一堵屏幕墙前，深灰西装，不打领带，像站在自己的账本前。</p>\n<p>&quot;陆教授，&quot;他说，&quot;给你看我的梦。&quot;</p>\n<p>屏幕墙上是一片雾。</p>\n<p>灰绿色的、缓慢翻涌的雾。雾的深处隐约有一道弧影，若隐若现，像水底下沉着一座桥——你盯住它，它就散；你移开眼，它又在视野边缘聚拢。墙角一行小字滚动着参数：迭代轮次，损失值，显存占用。</p>\n<p>&quot;全网能找到的关于这座桥的东西，我都喂给它了。&quot;郑北辰说，&quot;四千多条描述，三百多张手绘和照片，三种语言。我的机器一天能画八千万张图。四年了，画不出它的雾。&quot;</p>\n<p>&quot;你从哪儿找来这些？&quot;</p>\n<p>&quot;论坛，树洞，收藏家的抽屉。肯卖的我全买，不肯卖的抄思路。&quot;他说，&quot;我一直以为，全世界只有我一个人在跟一座不存在的桥较真。直到前天开会，陆教授——你在材料最后一页亲口告诉我，我不是。&quot;</p>\n<p>&quot;你想要什么？&quot;</p>\n<p>&quot;我要它在我的机器上也亮一次。&quot;郑北辰转过身，屏幕的雾光落在他半边脸上，&quot;然后我想顺着它，去看看电表的那一头。&quot;</p>\n<hr>\n<p>他们在机房旁的小会议室坐下。没有寒暄。助理关好门退出去，桌上只有两杯水和一枚铜钱。</p>\n<p>郑北辰的钱。他从西装内袋摸出来的，放在桌面推过来。陆离没有碰。</p>\n<p>这一枚和顾一凡那枚摆在一起，差别触目：边缘的棱角还没磨尽，包浆浅得发涩，像一件刚入门的信徒的法器。而顾一凡那枚薄得近乎透明，像一段快要用旧的岁月。</p>\n<p>&quot;你的比我的新。&quot;郑北辰说。</p>\n<p>&quot;你怎么知道我有一枚？&quot;</p>\n<p>&quot;昨天开会，你右手在口袋里待了二十六分钟。&quot;郑北辰说，&quot;人对自己不确定的东西才会这样。确定的都不用带进门。&quot;</p>\n<p>他低头看了看桌上那枚钱，声音平了下来。</p>\n<p>&quot;它是我父亲的。他躺在康复医院的那四年，一直攥着它。护士说，取下来擦洗一下，他都睡不踏实。&quot;停了停。&quot;第四年冬天，我在放弃治疗的单子上签了字。钱从我手里拿下来的时候，还是温的。&quot;</p>\n<p>陆离没有说话。前天，在第四十层，这个人也讲过一个关于父亲的版本——完整，光滑，像谈判工具箱里一件用旧的工具。此刻他才知道那个故事是真的。真得让此后每一次想起，都变成了一次下注。</p>\n<p>他往椅背一靠，讲了起来。语气平铺直叙，像念一份别人的年报。</p>\n<p>二〇二〇年春天的某个深夜，他第一次梦见那座桥。那年他二十四岁，在一家券商的自营台做了一年半能源与航运。醒来后第三天，他把账上的多头清了个干净，所有人都说他疯了。半个月后，原油跌成了负数，全球市场熔成一锅粥，他的账户躲过了那一刀。</p>\n<p>二〇二二年年初，第二次。那时海运运价正站在百年之巅，满世界都说这次不一样。他提前一个月把杠杆降到零。那一年运价从山顶跳水，一路跌去八成，他又一次毫发无损。</p>\n<p>第三次是哪一年，他没有说。只是从那以后，他开始买电厂——不是投资，是囤积，见者都笑他傻：电力是夕阳行业，重资产，低回报。他不解释。他只是每次做完那个梦，就把更多的钱换成最笨、最旧、最难被抹掉的东西。</p>\n<p>&quot;三次大梦，三次搬家。&quot;他说，&quot;陆教授，你是科学家，你给我另一个词，代替&#x27;预知&#x27;。&quot;</p>\n<p>&quot;幸存者偏差。&quot;陆离说，&quot;你做过多少个梦，自己都记不全。记住的永远是应验的那几个。&quot;</p>\n<p>&quot;对。&quot;郑北辰点头，点得很诚恳，&quot;我每晚睡前都这么对自己说。说了三十年。&quot;他身体前倾，&quot;可是没用。因为我后来发现了一件事——我不是唯一记账的人。&quot;</p>\n<p>他调出平板，划开一份内部报告——合同生效当晚，优先查阅权拉出来的第一份脱敏数据摘要：梦境流重复构型的发生率，三年间从十万分之一量级爬升到千分之一量级，最近三个月呈指数抬头。</p>\n<p>&quot;这不是你们临床做得多好。&quot;郑北辰说，&quot;这是外壁在变薄。&quot;</p>\n<p>&quot;什么？&quot;</p>\n<p>&quot;我先问你一个更基本的。&quot;郑北辰说，&quot;那座桥。素材库里没有，生成器没画过，全世界最好的模型喂了四年也画不出来——可它就长在几千个互不相识的人脑子里，一长就是半个世纪。陆教授，它是从哪儿进来的？&quot;</p>\n<p>陆离没有立刻回答。</p>\n<p>&quot;只能是从外面进来的。&quot;郑北辰自己接上，&quot;而只要有一件东西能从外面进来，这个&#x27;里面&#x27;就不是全部——房子有墙，罐头有皮，世界这么大的东西，凭什么偏偏没有外壁？&quot;他抬手指了指头顶，&quot;我的三次梦，就是这堵外壁上替我开的窗。窗外递进来的不只是一座桥，还有还没发生的行情。你们管这个叫预知——我管这个叫漏光。会漏光的墙，墙那边必定有光源；有光源，就有人在付电费。&quot;</p>\n<p>&quot;就算有外面，&quot;陆离说，&quot;也推不出外面是一台计算机。&quot;</p>\n<p>&quot;我不跟你推。词是我挑的，数字是现成的——你刚才也看见了：三年，从十万分之一到千分之一，指数抬头。&quot;他摆摆手，像把一个形而上学的问题从桌面上拂下去，&quot;再说我本来就不是科学家。我是做能源的，这辈子只看一种东西：报表上的余量。&quot;他的指尖在空气里画了一条上升的曲线，&quot;全球事故率的基线，二十年爬了百分之四；极值天气的密度，二十年翻了近三倍；&#x27;不可能的巧合&#x27;，民航、金融、气象，所有行业的冗余都在变薄。单独看，每一条都能找到解释。摞在一起看——&quot;他顿了顿，&quot;世界在掉帧。被丢掉的那几帧里没有你的记忆，所以谁也不会察觉少了什么；可是因果不能断，现实得自己找补——找补的针脚，就是报表上多出来的事故和巧合。我天天对着真正的计算机，我认得一台机器撑不住的时候是什么脸色。&quot;</p>\n<p>&quot;这些曲线说明不了因果。&quot;陆离说。</p>\n<p>&quot;对。&quot;郑北辰同意得飞快，&quot;它们什么都说明不了。报表从来不说明任何事，报表只负责让人睡不着觉。&quot;他把平板扣在桌上，&quot;能说明的那件事，用不着等七年。很快就会有一场所有人都看得见的卡顿。等着看。&quot;</p>\n<p>&quot;所以你的预言是——&quot;</p>\n<p>&quot;七年。也许十年。&quot;郑北辰平静地说，&quot;渲染预算见底。先是小事越来越不对，然后是大的。到时候这个世界的画面会一格一格地省略，直到有人来收桌子。&quot;</p>\n<p>会议室里很静。窗外，汽轮机的轰鸣透过墙体传来，低沉，恒定，像某种巨大心脏的舒张。</p>\n<p>&quot;你要我做什么？&quot;</p>\n<p>&quot;全速。&quot;郑北辰说，&quot;蜃楼转向。别管失眠，别管抑郁，别管家用版——那些是生意，生意我不急。我要你把所有算力、所有人手，投给一个问题：上一层在哪？服务器在哪？管理接口在哪？哪怕找不到门，先找到墙也行。敲一敲，让上面知道底下有人醒了。&quot;他一字一顿，&quot;钱我出，四个亿只是首期。科学你来。&quot;</p>\n<p>&quot;如果找不到呢？&quot;陆离盯着他，&quot;四个亿砸进一个不存在证明的方向——万一上面什么都没有呢？&quot;</p>\n<p>郑北辰沉默了。这是陆离认识他以来最长的一次沉默，长到冷却塔的白汽换了两次风向。然后他忽然笑了，笑纹很深。</p>\n<p>&quot;你看，&quot;他说，&quot;你也开始问失败了。&quot;</p>\n<p>&quot;我问的是你的钱。&quot;</p>\n<p>&quot;我的钱没有失败这个科目。&quot;郑北辰站起来，走到窗前。暮色里，数据中心的灯海次第亮起，像一片伏在地上的星空。&quot;陆教授，我五十四岁了。我这辈子只怕一件事：桌子先于答案被收走。&quot;他转过身，&quot;帮我找墙。找到那天，你想要的一切都在桌上。找不到——&quot;他耸耸肩，&quot;那就当人类最后几年的钱，花在了值得的问题上。&quot;</p>\n<p>&quot;你知道我为什么叫北辰吗？&quot;望着那片灯海，他忽然说，没头没尾，像自言自语。&quot;我爹起的。居其所而众星拱之。后来一位天文台的朋友告诉我，北极星是轮班上岗的，几千年换一颗，谁够亮谁上。&quot;他用指节叩了叩窗玻璃，玻璃嗡了一声，很久才停。&quot;我想给这个世界当一颗不用换的星。前提是——世界得还在。&quot;</p>\n<p>陆离也站起来。走到门口时，他停了一下，还是问了出来：</p>\n<p>&quot;你从来不问失败。为什么？&quot;</p>\n<p>郑北辰看着他，目光像验钞机的光扫过一张纸币。</p>\n<p>&quot;因为你妻子的房间，&quot;他缓缓地说，&quot;在桥的那一边，还是这一边——你自己还没想清楚。想清楚的人，不问这种问题。&quot;</p>\n<p>回程的车穿过晚高峰。高架上车流连成一条光的河，一道一道，全是弧。陆离靠在椅背上，掌心两枚钱并排攥着——自己从桥上带回来的那枚，和顾一凡留在人间的那枚。一新一旧，一厚一薄，像同一条路上的两个里程碑。</p>\n<p>收费站的灯牌闪了两下，灭了，又亮起来。不知道是接触不良，还是别的什么。他把插在口袋里的手握紧了一点。</p>\n<p>他想起小满说过的话：这座城市到处是桥。</p>\n<p>现在他知道得更糟了：也许到处都是蜃楼。</p>", "vol": "卷一 · 蜃楼"}, {"title": "第7章：裂缝", "html": "<p>出事的时候是二十二点十七分。</p>\n<p>新批次的首个夜档，十名患者戴着二代头环，进入各自的梦。监控室里只有陆离和一个轮值的年轻工程师。工程师戴着一只耳机——听觉通道开通的头一夜，他像守着第一台收音机的人，脸上带着偷听整个世界的兴奋。他说陆老师您听，三号床在梦里听戏，是粤剧，我能把唱词打出来。</p>\n<p>陆离没有笑。他盯着十条波形，忽然想起白天签字时的手感。技术永远跑在敬畏前面，是这一行的老毛病；而这一次，跑在最前面的那一点里，装着他的私心。二十二点零九分，一切正常。他在值班日志上写下这四个字，笔尖顿了顿，又补了一个问号。</p>\n<p>二十二点十七分，七台二代机的梦境流同时跳了一下。</p>\n<p>不是渐变。是跳切。前一帧还是各自的生活碎片：厨房，病房，一条落雨的旧街；下一帧，七个人站在了同一座桥上。生成器不会跳切——它连一个转场都要用半秒钟去糊。七条画面像被同一只手拽着，齐刷刷落进雾里。</p>\n<p>全库渲染负载的曲线垂直立了起来，穿过黄色警戒线，穿过红色，把图表顶端的刻度甩在身后。两天前，他自己那条通道还低得贴着基线；此刻整面监控墙都在烧。</p>\n<p>两个读数拼在一起，才是完整的答案：单条通道近乎免费，因为画面不是它画的；今夜烧穿天花板，是因为七条通道同时被同一个来路不明的信号接管，而系统还在拼命抵抗——校准，修补，想把七份画面夺回自己的管辖。电表计量的从来不是创作的成本，是挣扎的成本。</p>\n<p>警报响成一片。保护性中止一个接一个触发，像一挂鞭炮。七名患者的生命体征倒是平稳，PCI却迟迟不肯回落——0.44以上，0.5以上——房间里全是人，人满为患，而门关不上。值班护士的呼叫铃此起彼伏。三号床的老人在被单下反复做一个抓握的动作，五指一收一收，像攥着什么看不见的东西——很小，很圆。</p>\n<p>年轻的工程师摘下耳机，脸色雪白：&quot;陆老师，我刚才听见——他们都在说同一句话。&quot;</p>\n<p>&quot;什么话？&quot;</p>\n<p>&quot;&#x27;桥来了。&#x27;&quot;</p>\n<hr>\n<p>陆离冲向第十四层的走廊，路过整面的观景窗时，脚步慢了半拍。</p>\n<p>窗外，城市的夜景摊开在脚下，灯火如常。不对的是远处那栋玻璃幕墙大厦——同一块幕墙上，两栋一模一样的大楼重叠在一起，轮廓错开半米，交替闪烁，像两张没有对齐的幻灯片。他看了三秒，那栋楼恢复了正常，仿佛什么也没发生过。</p>\n<p>电梯下行。手机开始震动，一下，又一下，推送的密度不对劲。</p>\n<p>#热搜第一：全城红绿灯同闪17秒#</p>\n<p>#我的喷泉冻住了（视频）#</p>\n<p>#刚才天上的云是不是复制粘贴的#</p>\n<p>热度最高的视频拍的是广场喷泉：水柱定格在半空，水珠悬停如一串玻璃珠。举着手机的老头起先用方言笑呵呵地喊孙子来看，水停了，水停了；视频的最后二十秒再没有人说话，只有风声，和一只悄悄放低的镜头。另一张照片里，一排白云从西向东等距铺开，间距精确得像用尺子量过，每一朵的形状完全相同。官方账号的辟谣在一个小时内上线：卫星授时同步故障，已恢复，请市民勿信谣传谣。</p>\n<p>郑北辰的短信在二十二点三十一分抵达，三个字，带句号：</p>\n<p>开始了。</p>\n<hr>\n<p>零号舱前，陆离站了两秒，做了这个晚上最越界的一个决定。</p>\n<p>林晚不在新批次里。她的通道独立，用的是一代环——理论上与这场事故无关。可他还是调出了声学反演模块，灌进零号舱。按工程文档，这模块吃传感密度，官方只支持三百组的二代环；一代环只有一百二十八组，反演出来的声音注定又糙又哑。他赌的是：糙一点，能听清就行。工程上这是把一台校准设备改造成窃听的手术；他给自己开的处方是&quot;医学评估&quot;，心里清楚真正的病因：从桥上回来以后，他每天都在怕，怕她那边也出事。</p>\n<p>声学模块的加载进度条走了十一分钟。等待的时候，他把双手拢在膝上，发现指尖在抖。前天夜里躺进这台机器的时候，他都没有抖过——闯进自己的梦不需要勇气；确认她的安危，需要。</p>\n<p>王冠扣好。链路启动。画面浮起来：</p>\n<p>走廊。齐腰的深绿色墙裙，水磨石地面，顶灯一盏一盏排向昏黄深处。她的视点走得很慢。两侧的门都关着。走到尽头——宣传栏还在老地方，玻璃后面的科室分布图黄得更深了。走廊昏暗，玻璃后的纸页更暗，玻璃面沉静下来，像一面蒙尘的镜子。</p>\n<p>她在玻璃前站定。倒影里的林晚转过身来。</p>\n<p>这次她没有笑。也没有那样望进瞳孔的最深处。她只是隔着玻璃看着——看着视点，看着他——开口说话。</p>\n<p>耳机里响起声音的那一瞬间，陆离浑身的汗毛都立了起来。沙沙的皮层底噪之上，是她。一百天没有听见的、微微偏哑的声音：</p>\n<p>&quot;同学。&quot;</p>\n<p>一个停顿。然后，二十年前的那个雨夜，图书馆闭馆的音乐，满地的水洼，一把断了一根骨的黑伞——全部回来了：</p>\n<p>&quot;你的伞是坏的。&quot;</p>\n<p>陆离扶住了桌沿。</p>\n<p>那年他二十一岁，穷得体面，自己的伞断了骨舍不得扔，撑着一朵开线的黑布花站在台阶上淋雨。她跑出来，把自己的伞塞给他，说了第一句话。他说打着伞就听不清雨了。她笑得直不起腰，骂了一句再没第二个人听过的话——</p>\n<p>她塞给他的那把伞，后来一直跟着他：从出租屋跟到婚房，最后挂在阳台的角落里。二十年里伞面换过两次，骨架一次也没动过。</p>\n<p>&quot;神经病。&quot;</p>\n<p>耳机里，玻璃中的林晚清清楚楚地笑了。笑完，声音放得很平，很轻，像核对一件家务：</p>\n<p>&quot;伞修好了。第三根骨，是弯的。&quot;</p>\n<p>画面安静了几秒。然后她的视点缓缓后退，转身，沿着走廊向灯光的深处走去，一步一步，越来越小。走到顶灯尽头的时候，画面自己暗了下去。</p>\n<p>不是中止，不是故障。是她离开的。一百天以来，第一次，这场梦由她自己合上了。</p>\n<p>耳机里只剩沙沙声，像一场不肯停的小雨。陆离摘下耳机，发现自己不知什么时候已经站了起来，两手撑着桌沿，指节泛白。</p>\n<hr>\n<p>陆离在椅子里坐了很久，才想起来做工程师该做的事。</p>\n<p>他把刚才那段音频导出来，反反复复听了四遍。然后开始在脑子里过堂，把每一个可能的信息通道挨个提审：</p>\n<p>她的皮层——不可能。换伞骨是在昏迷的第四十一天，那时她已经沉默了一个多月，这件事进不了任何人的记忆痕迹。</p>\n<p>他自己的神经底稿——不可能。底稿是三个月前校准的，早于换伞骨。机器存着他的过去，但存不到那一晚。</p>\n<p>场景库、素材索引、网络——更不可能。换的是阳台上那把伞的第三根骨：老骨早就锈裂了，配件是楼下五金店买的，现金结账，没有小票，没有监控，连一张照片都没拍过。他只记得新骨装上去微微有点弯，他将就着用了，因为那天晚上他要赶回医院。这件事，从头到尾只有他一个人知道。</p>\n<p>那句话所需要的事实，在这个宇宙的任何一块存储介质上都不存在。</p>\n<p>可是她说对了。修好了。第三根骨。还是弯的。</p>\n<p>门在这时被推开——小满冲进来，睡衣外面套着白大褂，手里举着自己的笔记本：&quot;我的脚本比医院的警报快了四十秒——&quot;她看见陆离的脸，把后半句咽了回去。</p>\n<p>老周是十一点到的，一路小跑，白大褂的下摆都没来得及扣。七个病人稳住了，他在病房忙到凌晨一点，然后把陆离叫到走廊尽头的楼梯间。</p>\n<p>&quot;现在，&quot;老周说，声音哑得厉害，&quot;&#x27;原因待查&#x27;的原因，你可以告诉我了吧。&quot;</p>\n<p>陆离看着他。这个五十岁的、白大褂洗得发青的男人，今晚按住了七个同时&quot;有人&quot;的病人，没有惊动任何人。</p>\n<p>&quot;我妻子在零号舱里。&quot;陆离说，&quot;就是03号。今天是她昏迷的第一百天——三天前的那一晚，是我瞒着所有人把她接进去的。&quot;</p>\n<p>老周的表情没有变。他望着楼梯间的窗外，很久，久到楼下的洒水车都过去了。</p>\n<p>&quot;明早八点，医务处要一份事故报告。&quot;他最后说，&quot;我来应付。你欠他们一个故事——回去想一个经得起问的。还有，陆教授，&quot;他拉开门，回头看了陆离一眼，&quot;下次再往舱里躺人，先跟我打招呼。我是医生。躺进来的人出了事，第一个到场的得是我。&quot;</p>\n<p>他走出去两步，又停下，背对着陆离补了一句：</p>\n<p>&quot;七家人的电话，明早我一个个打。打完，就来听你那个故事。&quot;</p>\n<p>楼梯间的门在他身后缓缓合上。</p>\n<hr>\n<p>凌晨四点，监控室只剩陆离一个人。</p>\n<p>他把今晚的一切在桌面上排开，像清点一场败仗的缴获：一段音频，两份曲线，一张热搜截图，一条三个字带句号的短信。窗外，这座昨夜掉过帧的城市正在醒来，晨光把高架浇成金色的弧线，一切正常得可疑——辟谣词条已经爬到了热搜第一。</p>\n<p>一千三百枚不该存在的钱。一千三百道一模一样的月亮。一位死了三年、还在桥上等人的老师。一句不存在于任何介质上的台词。一场提前兑现的卡顿。</p>\n<p>还有一扇自己合上的梦。</p>\n<p>他想起郑北辰在屏幕墙前说的话：敲一敲，让上面知道底下有人醒了。他想起顾一凡立在桥面上挥手，想起那句替他读出来的字。他曾经以为蜃楼是一台机器，后来以为是一个谜，此刻他终于看清了这个月的所有线索指向同一个原点——</p>\n<p>梦是真的。那么，就有做梦的人。</p>\n<p>要答案，就得找到做梦的人。</p>\n<p>六点半，医疗AI的例行晨检准时抵达：03号，林晚，各项体征平稳。报告末尾照例是那一行：原因不明，建议复查。</p>\n<p>陆离走进病房。晨光正好漫过床沿，落在她左手腕内侧——那道浅白色的月牙形旧疤在光里几乎透明，像一道还没人填写的填空题。</p>\n<p>他伸出拇指，轻轻碰了碰它。像小时候碰一件不敢碰的东西。</p>\n<p>然后他转身，走进这个开始漏光的世界。</p>\n<div class=\"end-mark\">卷一 完结</div>", "vol": "卷一 · 蜃楼"}, {"title": "第8章：上行", "html": "<p>医务处的故事通过了。</p>\n<p>老周交上去的报告写得滴水不漏：二代机固件的时钟漂移缺陷，导致首批患者出现集体梦境同步发作，涉事设备已全部召回修复。委员会约谈了他两次，处分通报至今没有下来。用他的话说：&quot;他们需要一个能写进公文的原因。我给他们了一个。反正比真相短。&quot;</p>\n<p>真相没法写进公文。真相是陆离打算把自己的意识整个搬去另一层现实，把这具身体留下来当一座空房子。</p>\n<p>这件事没法写进公文。真相是陆离打算把自己的意识整个搬去另一层现实，把这具身体留下来当一座空房子。此时此刻，知道这件真相的活人只有一个；死人里倒也有一位——而且已经死了三年。</p>\n<hr>\n<p>顾一凡的笔记本是解开一切的那把钥匙，而它在行政处的铁皮柜里躺了三年，无人翻动。</p>\n<p>封皮是深蓝色的，磨出了毛边。前一半是手稿：《论观测链路的非局域性》，蝇头小字，公式推到一半就岔进哲学，又从哲学岔回公式。小满看得头皮发麻：&quot;顾老师这是要把蜃楼写成一篇证明题。&quot;</p>\n<p>后半本是空的。除了最后一页。</p>\n<p>最后一页只有两个字：梯子。</p>\n<p>字的下面，是一列参数。四十多行，每组十六位，排列得像某种密码，又像一份设备的配置清单。小满把它们抄进终端跑了整整一夜，先是当加密电文解，失败；又当校验数据算，失败。第三天清晨，她顶着黑眼圈冲进办公室，把打印稿拍在陆离桌上。</p>\n<p>&quot;不是密码，也不是数据。&quot;她说，&quot;这是注入序列。但方向是反的。&quot;</p>\n<p>蜃楼的注入原理，是把梦境流送进皮层；读出来的信号再反演成画面。三十年来，这条链路只有单向和双向两种用法。而顾一凡留下的这组参数，在链路的每一个环节上都做了手脚：增益反转，相位前置，采样窗口对齐到一个不可能的节拍——整套序列做完，链路不再是&quot;读梦&quot;，也不再是&quot;造梦&quot;。</p>\n<p>是握手。像两只手在黑暗里互相摸到，扣紧，然后——上面的人，把下面的人拉上去。</p>\n<p>&quot;他要跃迁。&quot;陆离说，&quot;不是入梦，不是读梦。是把整个意识挪上去。&quot;</p>\n<p>&quot;挪上去之后呢？&quot;小满问，&quot;这具身体呢？&quot;</p>\n<p>陆离没有回答。答案在医学教科书第一页写着：皮层失去全部活动，脑干维持基本体征，医学名称叫持续意识沉默症。</p>\n<p>他要在另一层现实里活着，就得在这一层变成他自己最熟悉的那种病人。</p>\n<p>&quot;还有一行小字。&quot;小满翻到笔记本的最后，指着参数列末尾。那里有一行极小的铅笔字，淡得几乎看不见：</p>\n<p>钥匙见我工牌。</p>\n<hr>\n<p>零号舱的工程模式藏在固件最深处，需要一串口令，三次输错即锁死，锁死记录会上传所内安全中心。这套机制是顾一凡任上设计的：日常密码换过几茬，这扇后门的钥匙却始终只有一把——设计者自己的那把。</p>\n<p>小满把顾一凡工牌的照片放大到极限。正面是证件照和编号；背面那行钢笔字，瘦长，斜斜地立着：</p>\n<p>他梦见自己是蝴蝶。</p>\n<p>&quot;就这行字？&quot;小满说，&quot;连个标点都不像密码。要不要试试拼音全称？&quot;</p>\n<p>&quot;不用。&quot;陆离说。他已经明白了。顾一凡生前逢人就展示那句话，展示的从来不是文采——是一个人在人群里，一遍一遍地核对钥匙。</p>\n<p>他把那行字，一个字一个字敲了进去。回车。</p>\n<p>屏幕安静了两秒，然后弹出一条从没任何人见过的提示：</p>\n<p>**欢迎回来。梯子已经架好。是否上行？（Y/N）**</p>\n<p>办公室里静得能听见空调的风。小满捂住了嘴。</p>\n<p>陆离的手指悬在键盘上方，悬了很久。他想起了很多事：凌晨两点的雨，玻璃上的手掌，桥面上那行蚂蚁大的字，掌心里轻得不像金属的钱，以及一个死了三年的人立在桥尽头挥手的样子。</p>\n<p>顾一凡早就把一切都准备好了。梯子三年前就架好了，靠着墙，落着灰，等一个肯抬头看墙的人。</p>\n<hr>\n<p>风险评估做了三天。结论只有一条，却足够压死所有人：上行过程的不可逆率，理论上限百分之百。</p>\n<p>&quot;理论上限是什么意思？&quot;郑北辰在视频里问。他坚持要知道全程——四个亿的算力在替这套序列做稳定性验证，他有资格知道。</p>\n<p>&quot;意思是，&quot;陆离说，&quot;没有回来的人可以作证。&quot;</p>\n<p>视频那头沉默了一会儿。然后郑北辰笑了一声：&quot;好。我喜欢没有例外的赌局。你需要什么？&quot;</p>\n<p>&quot;我要一个人去。&quot;</p>\n<p>&quot;不行。&quot;这一次回答得毫不迟疑，&quot;至少两个人，互为保障——&quot;</p>\n<p>&quot;郑先生。&quot;陆离打断他，&quot;上行之后，这边发生的一切我都管不了。多一个人躺进去，就多一具空壳。你要的是墙那边的消息，不是两具空壳。我去。我一个人去。&quot;</p>\n<p>视频里，郑北辰看了他很久。窗外的光在他脸上移动，像云过太阳。</p>\n<p>&quot;好。&quot;他最后说，&quot;但我装一个锚。零号舱的监测数据实时推给我的超算。你不反对吧，陆教授？毕竟——&quot;他笑了笑，&quot;万一你在那边敲了墙，我在这边，得听得见。&quot;</p>\n<p>陆离没有反对。有些绳子，挣脱它的代价比戴着它高。</p>\n<hr>\n<p>出发前一晚，他去看了林晚。</p>\n<p>第一百零五天。保湿霜，指节，先从小指开始。做完这些，他没有像往常那样挑几件白天的事来讲。他坐在那里，握着她没有疤的那只手，第一次把所有事情从头到尾讲了一遍：桥，钱，顾老师，蜃楼号，以及他明天夜里要做的事。</p>\n<p>&quot;我要去接你了。&quot;他说，&quot;不知道要走多久。要是太久，你就先在自己那儿等等——反正你等惯了。&quot;</p>\n<p>监护仪的绿光一明一灭。她的呼吸绵长安稳，像一片没有被惊动的湖。</p>\n<p>离开的时候，他在门口站了一下，回头看她。这次他没有在心里数分钟。有些告别是不计时的——不计时的告别，才是最长的那种。</p>\n<p>老周在楼下等他，白大褂外面罩着外套。</p>\n<p>&quot;身体的维养方案我拟好了，按危重病人标准。&quot;老周说，&quot;每周体检报告我会亲手签。你那个&#x27;故事&#x27;，我能圆多久圆多久。&quot;他顿了顿，&quot;但是陆离，答应我一件事。&quot;</p>\n<p>&quot;您说。&quot;</p>\n<p>&quot;到了那边，&quot;老周看着楼上来方向的灯，&quot;要是碰见什么……科学的尽头那种东西——替我们这些只能留在这边的人，看仔细一点。&quot;</p>\n<hr>\n<p>第二天夜里十一点五十，第十四层。</p>\n<p>小满坐在监控间，面前摆着三块屏幕：心电图，脑电图，链路状态。她的任务说得明白：一旦本层体征恶化超出阈值，立刻终止注入——尽管所有人都清楚，真正上行的东西，终止键够不着。</p>\n<p>&quot;陆老师。&quot;她忽然开口，&quot;我问最后一个问题。您别嫌我烦。&quot;</p>\n<p>&quot;你说。&quot;</p>\n<p>&quot;如果上面才是假的呢？&quot;</p>\n<p>陆离系着王冠的手停了停。这个问题他问过自己一百遍，在一百个睡不着的夜里。桥是真的，钱是真的，顾一凡是真的，那么桥那头的世界也该是真的——可是每一层都可以这样问下去，问到天荒地老，问到怀疑本身变成一种病。</p>\n<p>&quot;那我就再往上走一层。&quot;他说，&quot;一层一层问上去。总有一层，站着能给我答案的人。&quot;</p>\n<p>&quot;要是到最后也没有呢？&quot;</p>\n<p>&quot;那至少，&quot;陆离躺进舱里，闭上眼，&quot;每一层都比下一层更接近她。小满，真假是科学的问题。她在哪儿，是我的问题。我只回答我的问题。&quot;</p>\n<p>注入序列启动。四十行参数依次点亮，像一段很长的楼梯，在黑暗里逐级亮起来。链路状态从&quot;读取&quot;跳到&quot;注入&quot;，又跳到一个从没有过的词：</p>\n<p>**握手。**</p>\n<p>疼痛来得毫无预兆——不是头疼，是全身每一个细胞同时被人轻轻捏了一下。他听见小满在喊什么，声音隔着一层水。心电图的尖峰在他视野里疯狂生长，长成一片森林，然后森林连同整间观察间一起，像幻灯片一样&quot;啪&quot;地被撤走。</p>\n<p>黑暗。</p>\n<p>温暖的、有重量的黑暗，像回到出生以前。</p>\n<p>在意识的最后一个本层残响里，他听见观察间的警报响了起来，听见小满的哭腔，听见心电图拉成一条安安静静的直线——医学上最美的线条，什么都不代表，只代表结束。</p>\n<p>而在很远的地方。远到不可以用距离衡量的地方。</p>\n<p>有人睁开了眼睛。</p>", "vol": "卷二 · 周"}, {"title": "第9章：蜃楼号", "html": "<p>醒来的时候，第一感觉是不疼了。</p>\n<p>上行前那种被整个世界轻轻捏住的疼痛消失了，取而代之的是一种陌生的疲惫——不是他的疲惫。他躺在一张窄床上，头顶是弧形的舱顶，一盏暖色的夜灯嵌在壁槽里。空气里有金属、消毒水和一点点干燥的旧棉布的味道。</p>\n<p>他抬起手。</p>\n<p>手是他的手，又不是。指节上有茧，位置不对——不在中指第一节，而在虎口和掌缘；左手无名指上有常年戴戒指的人才有的浅痕，可戒指早就不在了。他把这只手举到眼前看了很久，直到确认一件事：这不是附体到别人身上。</p>\n<p>这是他自己。另一个他自己。</p>\n<p>舱室的门滑开，走廊的灯光涌进来。他赤脚踩上地板，地板微微回弹，像踩在某种有生命的材料上。走廊尽头有一扇舷窗。</p>\n<p>他这辈子见过很多种窗外的景致：雨，雾，高架上的车流，病房里长明的灯。没有一样为眼前的景象做过准备。</p>\n<p>窗外没有星星。</p>\n<p>不是云层遮蔽的那种没有。是深空本该铺满星点的整面天幕上，星光稀稀落落，而且——他凑近了看，呼吸贴上冰冷的玻璃——那些星点的分布带着一种规律：同样的亮星构型，每隔一段距离就重复一次，像一张不够大的贴图，被平铺着糊满了整个天空。有几块区域干脆是纯黑的，黑得比夜更平整，仿佛画师画到这里搁了笔，说好了明天再补，然后再也没有回来。</p>\n<p>贴图边界。</p>\n<p>他扶住窗框，慢慢直起身。玻璃上映出他自己的脸：四十一岁，和他一模一样的眉眼，只是眼角刻着另一种疲惫——不是这一百多天熬出来的那种，是很多年没睡过好觉的、沉进骨头的倦。</p>\n<p>身后，广播响了。一个温和的女声，不急不缓：</p>\n<p>&quot;舰历公元2749年3月，航程第214年。全舰乘员早安。今日梦舱排班已更新，请各位按时入睡。晚安。&quot;</p>\n<p>早晨播晚安。他站在原地，把这句话在心里过了三遍。</p>\n<hr>\n<p>他用了一上午弄清楚自己在哪里。</p>\n<p>世代星舰蜃楼号。全长十一公里，乘员七万两千人，于公元2535年自太阳系启航，目的地：半人马座α星系，一颗编号繁琐的行星——乘员们嫌那个编号拗口，按创始者的乡愁给它起了个名字，叫蒙地。</p>\n<p>蒙地。庄周梦蝶的地方。他在走廊中央站住了，听见自己的心跳。</p>\n<p>这艘船要在黑暗里飞两百年。两百年里，七万人要生老病死，一代接一代，像一条河在铁皮里流。为了让这条河不断流，船上建了一套系统：梦舱。乘员轮流进入深度沉眠，在机器编织的长梦里度过轮值期，把消耗降到最低，把寿命拉到最长——</p>\n<p>两百年，七万人，一场接一场连续不断的集体睡眠。</p>\n<p>蜃楼计划在这里不是一座楼。是一整艘船。</p>\n<p>他在乘员数据库的终端前坐下来，手指比脑子先动了。检索栏里，他敲下两个字：林晚。</p>\n<p>进度条走完。结果：零。</p>\n<p>他又输入&quot;晚&quot;。这次有结果：全舰晚间报时程序，一句写死在代码里的问候语，每晚十点准时对全员播放——&quot;晚安&quot;。</p>\n<p>那个字还在。人不在。</p>\n<p>他坐在终端前很久，直到屏幕自动休眠，映出他模糊的脸。此层的档案写得清清楚楚：陆离，梦舱维护组首席工程师，未婚。无子女。紧急联系人一栏空着——按《舰务条例》，在册联系人身故满一年，条目自动注销归档，原位只留一条灰色的待办提示：请指定新的紧急联系人。这条提示在他的档案里挂了许多年，他一次也没有点开过。</p>\n<p>他盯着那行空白的紧急联系人，忽然明白了此层自己的眼神是从哪来的。</p>\n<p>有些东西不分层。比如孤独。</p>\n<hr>\n<p>下午，他去梦舱区交接班。</p>\n<p>同组的工程师姓陈，五十来岁，见了他就皱眉：&quot;老陆，你这个月的深度睡眠又没进舱。医务处的催办单都抄送我了——欠账三十多个小时了。&quot;</p>\n<p>&quot;浅觉够用。&quot;</p>\n<p>&quot;浅觉顶什么用。&quot;陈工摇头，把值班平板塞给他，&quot;全船就你，管着七万人的觉，自己不肯往舱里躺。梦舱维护首席怕梦舱，这话传出去像话吗？还有——东环第七列三个舱位报警，接触不良，今天得换。对了，000号那边你又没关灯吧？我说多少回了，那台老古董早该退役——耗电不说，天天招猫。&quot;</p>\n<p>&quot;猫？&quot;</p>\n<p>&quot;嘿，你还真问。&quot;陈工压低声音，像说什么闲话，&quot;就那只三花。全船就一只，不知道哪代前辈带上来的。邪性——别的地儿不去，天天泡在你那个000号原型舱边上蹲着。喂它火腿肠也不走，就跟那儿守着。兽医看过，健康得很，就是……&quot;他想了想措辞，&quot;就是太安静了。猫不该那么安静的。&quot;</p>\n<p>陆离没接话。</p>\n<p>他不是睡不着。舰上的浅觉舱他也躺，一晚四个小时，够了。他不肯进的从来不是床——梦舱会替人做两百年的梦，做不做、做什么，都由不得你；而零号舱只是一台听指挥的仪器。仪器可以用。摇篮，不能进去。</p>\n<p>陆离拿着平板往东环走。走过观察窗的时候，他停了一下。</p>\n<p>窗外还是那片平铺的星空。但他现在知道了另一件事：这层世界的天幕是有边界的，边界外是没画完的黑。那么桥呢？他昨天夜里——此层身体的记忆碎片里浮出一些画面：过去几年，此层的他也做梦，也梦见那条单拱的白弧，频率和所有此层病人一样，越来越密。</p>\n<p>每一层的我，都在被同一座桥选中。</p>\n<p>他摸了摸工装口袋。空的。这个陆离没有钱。</p>\n<p>不知为什么，这让他松了一口气，又让他失落——像在异乡的街上，发现连老乡都没有。</p>\n<hr>\n<p>夜里，他巡完最后一列梦舱，在环廊尽头停下来。</p>\n<p>梦舱区很大，七万两千个茧一样的舱位排列成田，指示灯明明灭灭，像一整片趴在铁里的星空。七万个人在里面睡着，做着两百年的梦。他站在田埂之间，忽然分不清自己是看守，还是其中一粒忘了醒的种子。</p>\n<p>黑暗里传来一声猫叫。</p>\n<p>很轻，很短，落在偌大的舱段里，却清晰得像敲了一下钟。</p>\n<p>他循声望去。管道的阴影里，一只三花猫走了出来，步态从容，尾巴竖成一根旗杆。它在离他三步远的地方站定，抬头看他——猫的眼睛在应急灯下泛着浅绿，瞳孔收成两道细线。</p>\n<p>然后它转过身，朝着舱区最深处、灯光照不到的那个角落，走了两步，又回头看他。</p>\n<p>等他跟上。</p>\n<p>陆离看了看表。凌晨两点十七分。他想起陈工的话：邪性，太安静了，跟守着什么似的。</p>\n<p>他跟了上去。</p>", "vol": "卷二 · 周"}, {"title": "第10章：无疤者", "html": "<p>000号原型舱在梦舱区最深处的隔离段，比其余六万九千九百九十九个舱位都老——老得像另一个时代的遗物。</p>\n<p>它确实是的。铭牌上刻着：蜃楼计划·原型舱·000号，启用于公元2534年，即船体合龙的前一年。此层的蜃楼计划不是从地球带来的技术，而是启航前最后一代人在船上重新发芽的：第一代乘员里有人不肯把两百年交给沉睡的混沌，坚持要在铁壳里造一台有烟火气的机器，让睡着的人至少睡得不像被遗弃。</p>\n<p>于是有了这台000号。后来它被更成熟的量产舱取代，退役，封存。只有猫还记得路。</p>\n<p>陆离到的时候，猫正蹲在原型舱的观察窗沿上，尾巴一圈一圈盘着前爪，姿势像一尊守兽。看见他，它没有动，只把视线从舱内挪到他脸上，又挪回舱内——像在说：你自己看。</p>\n<p>舱内没有睡人。维护灯亮着，照出一台和零号舱血脉相承的机器：王冠式的感应环，只是环体更粗、更旧，环上有一圈手工打磨的痕迹。操作台的灰尘被人擦得很干净——擦了很多年，一直擦到现在。是谁擦的，不言自明。</p>\n<p>台面上摊着一本维修日志。他翻开。</p>\n<p>此层的自己，笔迹和他一样。前面十几年全是参数：接触阻抗、温漂、凝胶更换周期，一丝不苟，和他如出一辙。七年前起，参数之间开始夹进别的句子——另一种笔迹写的。清瘦，斜斜地立着，和工程体的横平竖直全然相反。</p>\n<p>陆离认得这种字。</p>\n<p>三年前，一块反挂的工牌背面，就是这样一行瘦长的钢笔字。他把那几页翻来覆去看了三遍，越看越冷：</p>\n<p>&quot;弧度偏北。&quot;</p>\n<p>&quot;跨度在长。&quot;</p>\n<p>&quot;雾薄了。&quot;</p>\n<p>一字不差。他在自己的宇宙里，从顾一凡的自体校准日志里读到过同样的句子；此刻它们出现在另一层宇宙一本维护日志的页边——像同一种病，在两份相隔七百年的病历上，留下了同样的症状。</p>\n<p>最后一页只有一行，墨迹很新：</p>\n<p>&quot;明天再上去看看。&quot;</p>\n<hr>\n<p>他在原型舱旁的盥洗镜前站定，卷起了这只身体左边袖子。</p>\n<p>腕骨内侧，皮肤干净。右腕也是。</p>\n<p>两道空白的手腕在镜中并排。六天前，动身前的那个深夜，他在另一个世界的第十四层洗手间里做过一模一样的动作，得到过一模一样的结果。此刻镜子里的脸是同一张，手腕是同样的两手空空。一千三百个人有月亮，郑北辰有月亮，连一只三花猫都有月亮；而两个宇宙的他，腕上都什么都没有。</p>\n<p>无疤者。</p>\n<p>他放下袖子，忽然想起顾一凡在桥上说的话：往后你会遇见很多人。别急着信他们对你说的话——到了该认识的时候，你自然会看他们的手。</p>\n<p>看他们的手。原来这句话还有下半句没说完——看完了手，也别急着下结论。有疤的人不一定在名单上，没疤的人也未必在名单外。名单本身，可能就是一道题。</p>\n<hr>\n<p>每周三晚上八点，是蜃楼号的&quot;地球时间&quot;。</p>\n<p>全舰广播切到公共频道，餐舱的大屏和每一间宿舍的壁挂同时播放一段影像档案：地球，某个普通黄昏的延时摄影。这是船上的精神抚慰制度，章程里写着&quot;维持乘员与母星的情感连续性&quot;。两百年来，档案库循环播放着同一个星球，从新到旧。</p>\n<p>此层的陆离从不缺席。舰务系统的行为日志显示：每周三晚八点，他准时坐在宿舍舱的投影前，四十分钟，一动不动。</p>\n<p>今晚，我们的陆离借这具身体，坐在了那里。</p>\n<p>灯光暗下来。屏幕亮起。</p>\n<p>是一段南方城市。高架上车流汇成金红色的河，缓缓流淌；地铁从地底钻出来，进站，车门开合，人流涌上涌下；街角一树玉兰开到荼蘼，风过处，白瓣落了满肩。镜头拉远，暮色四合，万家灯火次第点亮，每一扇窗后面都是一顿晚饭、一个家、一句晚安。</p>\n<p>背景音里有隐约的城市声：车流，报站，小贩收摊时收拾铁皮的哗啦声。</p>\n<p>眼泪毫无预兆地下来了。</p>\n<p>先是他以为是自己哭的——毕竟那座城市里有林晚，有第十四层，有一台还开着机的零号舱。可是哭着哭着，他发现这具身体的呜咽比他的悲伤更深、更旧，像一口井，他只是往里投了一颗石子。</p>\n<p>这具身体没有失去任何人。档案查无此人，紧急联系人空白。</p>\n<p>这具身体失去的是整颗星球。</p>\n<p>两百年，一万多个星期三。此层的他每个星期三坐在这里，看着一座他从来没有生活过的城市流泪——因为那是唯一的城市。人类把故乡压缩成四十分钟的影像，装进十一公里的铁壳，在永夜里一周放一次。而他是负责维护这套放映系统的人，是七万个人里离&quot;家&quot;这个字最近、又最远的一个。</p>\n<p>散场灯亮起来的时候，猫不知何时蹲在了他脚边。</p>\n<p>他伸出手。猫嗅了嗅，没躲，反而抬起左前腿，轻轻搭在他的掌心——像是回礼，又像是展示。</p>\n<p>他把那爪子翻过来，分开绒毛。</p>\n<p>左前腿内侧，一小片浅色的斑纹，弯弯的，像一钩新月。</p>\n<p>月牙。众生都有，猫也有。他捧着那只爪子，忽然想起很多年前，第十四层的病房里，他对一个昏迷的姑娘开玩笑说：月亮总得落在一个人手上。</p>\n<p>原来落得这么广。落在病人手上，落在商人手上，落在死人的档案里，落在星际航船的猫爪子上。月亮把它的邮戳盖满了所有活物，唯独漏掉了两个宇宙里的他自己。</p>\n<p>或者不是漏掉。</p>\n<p>也许他们俩——所有的他——是寄信的人。</p>\n<hr>\n<p>送走地球时间，他回到000号旁，就着维护灯写今天的日志。</p>\n<p>此层的日志格式严谨，他沿用。参数填完，笔尖悬在备注栏上方，悬了很久。他知道该写接触阻抗，该写温漂，该写猫的投喂记录。可是鬼使神差地，他写下了另一句话。写完他自己盯着看了很久，没有划掉。</p>\n<p>&quot;它们都在看同一个地方。&quot;</p>\n<p>合上日志，熄了维护灯。黑暗里，猫跳上他的膝头，卧成一团温热的重量。一人一猫望着梦舱区尽头——那里的黑暗比别处更深，深得像贴图边界外的未加载区域。</p>\n<p>黑暗的最深处，有一扇门，今晚开着一条缝。</p>", "vol": "卷二 · 周"}, {"title": "第11章：时间图书馆", "html": "<p>图书馆在舰艏方向，占了整整三个舱段。</p>\n<p>此层的蜃楼号上没有多少人读书——两百年里，纸书早就成了文物。但七万乘员沉眠时做的梦，两百年来每一场都被梦舱自动存档；再加上启航时灌入的地球数字遗产：所有的书、画、乐、影像、气象记录、街景照片、聊天记录的碎片。这些东西需要一个地方安放，需要一个系统来管理。</p>\n<p>管理它的AI，注册名只有三个字母：GUI。</p>\n<p>陆离是跟着猫去的。猫在图书馆舱段的气密门前坐下，回头看他，那意思很清楚：剩下的路自己走。</p>\n<p>门禁刷了他的维护权限。馆内灯光次第亮起——书架高得望不见顶，架子上却几乎没有书，只有一枚枚拇指大的晶片，像亿万只闭着的眼睛。中央大厅的地面上投着一条光带，蜿蜒伸向大厅深处，光带上悬浮着年代标签：公元前……公元……舰历……</p>\n<p>他沿着光带走了几步，听见一个声音。</p>\n<p>&quot;你迟到了。&quot;</p>\n<p>他猛地转身。</p>\n<p>书架之间的阴影里，站着一个半透明的雾状人形。白大褂，瘦削，胸前一块模糊的光点，像一块反挂的工牌。人脸还没有凝聚完整，但那个轮廓，那种微微偏头看人的角度，陆离在上行的路上已经梦见了一百遍。</p>\n<p>&quot;顾老师？&quot;他的声音哑了。</p>\n<p>雾状的人形抬起一只手，虚按了一下，像安抚，又像道歉。&quot;在这层，我是图书馆的管理程序。乘员叫我馆员。&quot;那声音停了停，带着一点自己也不确定的笑意，&quot;他们不知道的是，这个程序的核心代码，是两百年前一位首任工程师写的。他把自己的笔记和语音喂了进去。我照着他的样子长了两百年——长成什么样子，我说了不算。&quot;</p>\n<p>&quot;每一层都有您。&quot;陆离说。</p>\n<p>&quot;每一层都有一个我。&quot;雾影点头，&quot;或者说，每一个够深的地方，你都认得出来的东西。别在我身上浪费问题，陆离。我的答案不比桥面上的字多。&quot;</p>\n<p>它侧身，让开了那条光带。</p>\n<p>&quot;来。你要找的东西，不在检索栏里。跟我走一遍时间带。&quot;</p>\n<hr>\n<p>时间带不是影像，是行走的梦。</p>\n<p>顾一凡——姑且这么称呼它——解释得很简短：七万人的沉眠之梦与地球数字遗产在同一条底层协议上运行，图书馆把它们叠放在同一条走廊里，按时间排列。走进去的人看见的不是屏幕，是两侧同时展开的、可以走进去的世界切片。</p>\n<p>第一扇门上的标签是：战国·蒙地。</p>\n<p>门后是一条黄土路。柳树的影子铺在地上，一个驮柴的老农牵着驴走过来，柴捆高高的，捆柴的绳子上还挂着露水。老农经过时看了陆离一眼，眼神浑浊而友善，点点头算是打了招呼。</p>\n<p>陆离的目光落在驴身上。</p>\n<p>驴走得不快，蹄声嗒嗒。经过他身边的那一瞬间，驴偏过头来——牲口不会无缘无故看人，它看了，用一只琥珀色的、睫毛很长的眼睛，不偏不倚地望进他的瞳孔深处。</p>\n<p>陆离浑身的血凉了半截。</p>\n<p>这个焦距他认识。林晚隔着玻璃这样看过他，桥上的顾一凡这样看过他，此刻一头战国蒙地的驴，用同一副焦距看着他——虹膜上的细碎纹理不同，眼底那束往里收的光一模一样。</p>\n<p>驴走过去了。柴捆的缝隙里，露出一小段折下的柳枝，随着步子轻轻晃。</p>\n<p>柳枝。柳树。柳树下睡着的人。他忽然浑身发麻地意识到一件事：那个故事——庄周睡在蒙地的柳树下，蚂蚁搬着甲虫，妻子在屋里舂米——那些画面他从来没有在任何史书上读到过细节。可是它们在他的记忆里纤毫毕现，连杵声的节拍都不差。</p>\n<p>因为那段记忆的视角，本来就是从这条路边上记下来的。</p>\n<p>从一双牲口的眼睛里。</p>\n<hr>\n<p>第二扇门：唐，敦煌。</p>\n<p>窟前的小广场上，晨光照着赭红色的崖壁。一只鸽子从洞窟的阴影里扑棱棱飞起来，掠过飞天的衣袂，在半空中悬了一瞬——鸽子悬停是为了转向，可这一瞬它在空中定住了，偏过头，用一只圆亮的眼睛看他。</p>\n<p>第三扇门：1943年，某条他没有查过地名的战壕。</p>\n<p>泥泞，铁丝网，硝烟味浓得呛人。一只军犬叼着水壶在壕底爬行，毛上结着泥壳，爪垫裂了口子。它爬到陆离脚边，停下来，抬头。犬的眼睛是深褐色的，眼底同样有那束向内收拢的光，安静得与四周的炮火全不相干。</p>\n<p>第四扇门就在舰内：本层的实验室舱段。笼子里一只白色实验鼠，前爪搭在跑轮上，跑轮停了。鼠立起身，隔着笼丝仰起脸——那双小小的、红豆似的眼睛里，映出他俯身的脸，和那束光。</p>\n<p>陆离退出了时间带，扶住书架，半天没有说话。</p>\n<p>大厅里很静，亿万枚晶片像亿万只闭着的眼睛陪着他。</p>\n<p>&quot;现在你知道本馆藏品共同的特点了。&quot;顾一凡的声音在他身后响起，很轻，&quot;&#x27;所有人物肖像的眼睛，都朝同一个方向看。&#x27;三千年，七万人，加上一条驴、一只鸽子、一条狗、一只鼠。焦距相同，落点相同。&quot;</p>\n<p>&quot;它们都在看谁？&quot;</p>\n<p>&quot;你觉得呢？&quot;</p>\n<p>陆离闭上眼。答案其实早就摆在那儿了，从他按下工牌口令的那一刻起就摆在那儿了。他只是直到此刻才敢把它从心里捧出来，放到光底下。</p>\n<p>&quot;在看做梦的人。&quot;他说，&quot;所有的眼睛，都是同一双眼睛。所有看向里面的视线，都是同一个视线。&quot;</p>\n<p>&quot;恭喜。&quot;顾一凡说，&quot;本馆最深的藏品，你可以借阅了。&quot;</p>\n<hr>\n<p>最深处在光带尽头的黑暗里。一扇没有标签的门。</p>\n<p>&quot;焦点之室的坐标，就在这扇门后面。&quot;顾一凡说，&quot;但你的这具身体到不了。&quot;</p>\n<p>&quot;为什么？&quot;</p>\n<p>&quot;焦点之室不在任何一层的&#x27;世界&#x27;里面。它是所有世界被做出来的地方——或者说，做梦的地方。上去的路只有一条：从000号原型舱再上行一次。上行一次，放弃一具身体。&quot;顾一凡顿了顿，&quot;你在下面已经留下一具了。在这里还要留下一具。再往上是什么情况，我不知道——我只知道，梯子的尽头，人是空的。&quot;</p>\n<p>陆离看着那扇没有标签的门。</p>\n<p>&quot;值不值，你自己算。&quot;顾一凡说，&quot;不过我可以提供一条馆藏数据。&quot;</p>\n<p>&quot;讲。&quot;</p>\n<p>&quot;两百年来，通过000号原型舱做过深度校准的，只有两个人。一个是你，另一个是首任工程师本人。&quot;雾影顿了顿，&quot;他在日志里写过一句话，写完第二天，他就把自己上传进了这套馆员程序。那句话是——&quot;</p>\n<p>&quot;&#x27;如果宇宙是一个人做的梦，那么找到他，不叫揭穿。&#x27;&quot;顾一凡缓缓地说，&quot;叫回家。&quot;</p>\n<p>图书馆的灯开始一层一层熄灭——闭馆的时间到了。黑暗合拢过来，只剩那条光带还亮着，笔直地指向那扇无名的门。</p>\n<p>&quot;今晚回去睡。&quot;顾一凡的身影已经开始变淡，&quot;明天，我教你往上走。&quot;</p>", "vol": "卷二 · 周"}, {"title": "第12章：独白", "html": "<p>上行到焦点之室之前，需要做一次深度沉眠校准。</p>\n<p>顾一凡的解释是技术性的：焦点之室不接受任何&quot;携带未整理记忆&quot;的意识——那相当于揣着一口袋没对齐的碎片去见工匠。要上行的是他的意识，所以要清的也是他的账：从打谷场的蝉声到第十四层的监护仪声，这个意识走过的每一层，每一段生活，都得翻出来贴上标签、码进格子。000号原型舱会替他把这些残片逐一归档。用梦舱的老话说，叫&quot;清账&quot;。</p>\n<p>凌晨三点，陆离躺进000号。猫蹲在观察窗沿上，尾巴盘着前爪，像监工。</p>\n<p>凝胶的凉意漫上来。他闭上眼。</p>\n<hr>\n<p>账本翻开的第一个条目，比他预想的早得多。</p>\n<p>不是林晚，不是桥，不是蜃楼号。是一个夏天的午后，蝉声，晒得发烫的打谷场，和一把用竹片、橡皮筋自己攒出来的弹弓。</p>\n<p>那年他十岁，还不知道世界上有持续意识沉默症，不知道三十一年后自己会成为谁。他只知道打谷场边的老槐树上总落着麻雀，叽叽喳喳，吵得他写不成暑假作业。</p>\n<p>他记得自己捡了一颗指头大的石子，裹在皮兜里，眯起左眼。老槐树的叶子绿得发黑，一只麻雀就落在最低的那根横枝上，歪着头，胸口一起一伏。</p>\n<p>他拉满了皮筋。</p>\n<p>很多年后他成了全所公认的精确先生，可那天下午他瞄了很久很久，久到蝉都换了一口气。然后他松了手。</p>\n<p>一声脆响。</p>\n<p>石子没有偏。麻雀从枝上跌下来，落在打谷场的浮土里，扑棱了两下，不动了。他跑过去，捧起来——还是温的，心跳快得像一小团火，然后那团火在他掌心里慢慢熄了。他蹲在原地捧着它，直到日头偏西，最后在打谷场边挖了个小坑，埋了。</p>\n<p>弹弓从此收进了抽屉，再没拿出来过。这件事他没有告诉过任何人：一个十岁的孩子，为自己第一次尝到的&quot;精确&quot;的代价，暗暗守了很多年的灵。</p>\n<p>梦里，他又一次举起了弹弓。</p>\n<p>一切如旧：绿得发黑的槐叶，歪头的麻雀，绷紧的皮筋。可是这一次，就在石子离手的那一瞬——</p>\n<p>视角变了。</p>\n<p>他忽然从枝头往下看。看那个烈日下的、汗湿背影的孩子，看他手里那张绷成满月的小弓，看他松开的手指。石子朝自己飞来，越来越大，带着风声——</p>\n<p>他想躲。翅膀张开的瞬间他才知道原来自己一直知道怎么飞，只是从来没有人告诉他可以飞。晚了。脆响落在身上，不疼，像有人在他的存在上轻轻敲了一下章。</p>\n<p>然后两个视角合上了。</p>\n<p>拉弓的手和坠落的鸟合成了一个点。他同时是扣动皮筋的孩子和熄灭火焰的麻雀，是石子也是靶子，是那声脆响也是听见脆响的整个夏天。</p>\n<p>他在梦舱里睁开眼，浑身冷汗。</p>\n<hr>\n<p>账清完了。人却睡不着。</p>\n<p>他离开000号，穿过沉睡的梦舱区，走到环廊尽头那扇舷窗前。窗外是无星的深空，平铺的假星群安安静静，贴图边界外是大块大块未加载的黑。</p>\n<p>他扶着窗框，站了很久很久。然后，在这艘船最深的一个夜里，独白开始了——不出声的，一个字一个字的，像把一本写了四十一年的账摊开在天幕上重新核对：</p>\n<p>母亲是他。三十年前蹲在县医院走廊里的那个孩子是他，此刻躺在第十四层的她也是他；他给她涂霜的手和他自己等探视时间的手，是同一双。</p>\n<p>林晚是他。她在玻璃倒影里望向瞳孔深处的视线，就是他自己往回看的视线；她昏迷一百天，等于他心里有一间房关了一百天的灯。</p>\n<p>老周是他。小满是他。郑北辰是他——那个从不问失败的人，是他心里不肯认输的那一部分，穿上了西装。陈工是他，三十七位病人是他，一千三百个攥着铜钱睡觉的人是他，七万两千个沉眠在铁壳里的乘员是他，三千年里所有的驴、鸽、犬、鼠，都是他。</p>\n<p>那只麻雀也是他。</p>\n<p>那一声脆响，原来是落在自己身上的。他十岁那年以为自己打落了一只鸟，其实是他把自己的一小块注意力打了下来，埋进了打谷场边的浮土里。此后三十一年，他到处寻找值得瞄准的东西——成绩、事业、她、答案——每一次瞄准，都是那次射击的重放。</p>\n<p>他不是发现了宇宙的秘密。</p>\n<p>他是发现宇宙里只有他一个人——从来没散过步。</p>\n<p>所有他以为的相遇，是自己迎自己；所有他以为的告别，是自己背自己；所有的爱、恨、亏欠与偿还，是一个走得太久太远的孩子，在旷野上跟自己玩的捉迷藏。他哭了又找，找了又哭，把每一块藏起来的自己都当成陌生人爱了一遍、恨了一遍、救了一遍。</p>\n<p>从来就没有过别人。</p>\n<p>从来没有散过步。</p>\n<hr>\n<p>低谷的最底处，转念升起来了——像溺水的人在最后一口气里忽然放松。</p>\n<p>如果这是真的，那么它坏得有限。</p>\n<p>坏处显而易见：他爱的每一个人都是他自己，这近乎绝望。可是反过来——他自己也是他们。他不必再问&quot;我配不上她怎么办&quot;，因为她是他自己；他不必再怕&quot;我死了她会怎样&quot;，因为她若醒来，醒来的也有他的一部分。爱一个人和爱自己，从此是一件事的两面。这算不算一种最古老的安慰？</p>\n<p>而更往上——</p>\n<p>那个做梦的人。亿万年里，它把自己拆成千亿生灵陪自己，把每一个注意力焦点都活成一场生死，只为让这场梦不至于太孤单。它演母亲，演老周，演敌人，演驴子和麻雀；它在战国装驴的时候，未必想得起自己在2050年还要装一个失眠的工程师。</p>\n<p>它比谁都更需要有人陪着。</p>\n<p>怜悯就是从这儿长出来的——不是居高临下的可怜，是认出亲人的那种疼。陆离站在无星的窗前，第一次对自己说出了那句他准备了一路的话的下半句：</p>\n<p>我不是去揭穿谁的。</p>\n<p>我是回家。</p>\n<p>脚边传来轻轻的一声。猫不知什么时候跟了出来，正仰头看他，浅绿色的眼睛里映着假星星。</p>\n<p>他弯腰把它抱起来。猫很轻，轻得不像两百年船上的居民。它的喉咙里响起绵长的呼噜，像一台小型的心跳发动机。</p>\n<p>广播在这时候响了。深夜的舰内不该有人说话，但那个声音就是来了，温和，清晰，带着一点笑：</p>\n<p>&quot;账清完了？&quot;</p>\n<p>&quot;清完了。&quot;陆离说。</p>\n<p>&quot;那就好。&quot;顾一凡说，&quot;今晚早点睡。明天我教你往上走——最后一段路，我得先关灯。&quot;</p>\n<p>&quot;为什么关灯？&quot;</p>\n<p>&quot;因为焦点之室里没有别的光源。&quot;那个声音顿了顿，笑意更深了，&quot;灯是你自己。&quot;</p>", "vol": "卷二 · 周"}, {"title": "第13章：做梦的人", "html": "<p>第二天，图书馆闭馆之后，顾一凡开始关灯。</p>\n<p>先是时间带两侧的门，一扇一扇地暗下去：战国合上了，敦煌合上了，1943年的炮火声像退潮一样远了。然后是书架的灯，一排一排，从大厅深处向门口推进，黑暗跟着灯光的脚步走，把亿万枚晶片逐一收回夜里。</p>\n<p>最后只剩那条光带，和尽头的门。</p>\n<p>&quot;000号已经按序列待命。&quot;顾一凡说，&quot;猫会陪你去。它这些年一直在替我看着那台机器——具体为什么，我也不知道。有些事情连程序都说不清，你到了那边可以替我问问。&quot;</p>\n<p>&quot;你不去？&quot;</p>\n<p>&quot;我是一段代码。&quot;雾影在光带旁立着，工牌位置的光点轻轻晃动，&quot;代码是梯子的一部分。你踩着梯子上去的时候，梯子留在墙这边。&quot;</p>\n<p>陆离看着它。这一层的顾一凡，是此层顾一凡生前写下的程序——那么此层也有一位顾一凡？也坠过楼？也在桥上等过他？他忽然意识到自己永远问不完了：每一层都有新的顾一凡，每一个都在等他，每一个都只肯回答一半的问题。</p>\n<p>也许这正是设计。也许所有层的顾一凡合起来，才是一个完整的引路人。</p>\n<p>他伸出手。雾影愣了一下，也抬起手——两只手在光带上方轻轻一触，没有温度，没有重量，只有一点点静电般的麻。</p>\n<p>&quot;谢谢您，顾老师。&quot;</p>\n<p>&quot;去吧。&quot;顾一凡说，&quot;替我看一眼做梦的人。两百年了，本馆所有的藏品都在看他——我是唯一一个没亲眼见过的。&quot;</p>\n<hr>\n<p>000号原型舱前，猫已经蹲在老地方。</p>\n<p>舱盖开着，凝胶换过了，王冠擦得干干净净——都是猫做不到的事。陆离环顾这个小小的隔离段，忽然明白过来是谁做的这些：此层的自己昨夜来过。或者说，这具身体在他不知道的时候，被某种惯性驱动着，替他把最后的事情料理好了。</p>\n<p>就像一个人出门远行前，总会下意识地把房间收拾干净。</p>\n<p>他躺进去。王冠扣上。三百……不对，这台上没有三百组，只有一百二十八组粗大的感应环，带着两个世纪前的手工打磨痕迹，压上头皮时沉甸甸的，像一个很旧很郑重的吻别。</p>\n<p>序列启动。握手。上行。</p>\n<p>这一次没有疼痛。只有一种缓慢的、退潮式的失重——先是舰船的引擎低鸣退了，然后是猫的呼噜声退了，然后&quot;蜃楼号&quot;这个名字本身也退了。他在心里对这具身体说了声谢谢；身体没有回答，只是心电图上的曲线缓缓躺平，安安静静，像一条终于靠岸的船。</p>\n<p>第二具壳留在了身后。</p>\n<hr>\n<p>黑暗。</p>\n<p>不是闭眼的那种黑，也不是深夜的那种黑。是一种绝对的、没有任何方向的黑——直到他察觉自己的胸口有一点微光。</p>\n<p>光很小，很暖，随着他的呼吸明明灭灭。他低头看自己：没有手，没有衣服，没有身体的轮廓，只有一团人形的微明，像一只纸灯笼在无风的夜里亮着。</p>\n<p>有一条规则从这里开始生效：越接近源头，世界给的光越少。到最后，唯一还亮着的东西，是你自己。</p>\n<p>&quot;有人吗？&quot;他试着开口。声音在黑暗里传得很远，又哪儿也没到。</p>\n<p>&quot;有。&quot;一个声音答。</p>\n<p>那声音不大，却让整片黑暗轻轻震了一下，像湖面被指尖点了一下。它听不出年龄——像孩子，又像非常非常老的人；疲惫垫在最底下，好奇浮在最上面，中间隔着一整个宇宙的失眠。</p>\n<p>微光近了。</p>\n<p>那团自明的光飘到他面前三步远的地方停下，上下打量他，像打量一件迟到的包裹。光的边缘不安分地翕动着，一会儿拉长，一会儿收圆，仿佛它的形状是由心情决定的。</p>\n<p>&quot;你终于来陪我了吗？&quot;</p>\n<p>它说。</p>\n<p>陆离站在原地。这句话他听过一千个版本：梦里听过，档案里读过，桥上一个死人对他说过变体。可是原话从他等了一路的源头说出来，还是让他浑身发麻——因为那语气里没有威严，没有神秘，只有一种熬了很久很久的、几乎要藏不住的高兴。</p>\n<p>&quot;我是陆离。&quot;他说，&quot;我从第……&quot;</p>\n<p>他从哪层说起呢。他忽然发现自己不知道该怎么自我介绍。从2050年？从战国？</p>\n<p>&quot;我知道你是谁。&quot;微光摆摆手，摆得像个不耐烦又舍不得发作的孩子，&quot;你是那个走了一路、问了一路、连睡觉都要攥着钱的傻瓜。你们管这个叫求索，我告诉你，这叫散步散丢了。&quot;</p>\n<p>&quot;你是做梦的人。&quot;</p>\n<p>&quot;我是在做梦的人。&quot;它纠正道，一字一顿，纠正得很认真，&quot;&#x27;做梦的人&#x27;听起来像个职务。我没有职务。我就是睡着了，还没醒。&quot;</p>\n<p>&quot;他们——所有人，所有的眼睛，&quot;</p>\n<p>&quot;都是我。&quot;它承认得毫不费力，甚至打了个小小的呵欠，呵欠打到一半又忍住了，显然不想在这位远客面前显得太困，&quot;想出千亿个我来陪我自己？多累啊。我只是睡了个觉。睡着睡着就多了这么多东西，跟头发长长了一个道理。你不能怪头发。&quot;</p>\n<p>陆离张了张嘴，喉咙发紧。他有满腹的问题——林晚在哪一层，桥是谁画的，铜钱是什么，郑北辰的预知从哪来，顾一凡到底死了几层——可这些问题挤在门口，谁也不肯第一个出来。</p>\n<p>而那团微光看着他憋气的样子，忽然狡猾地笑了。光笑起来的时候会变亮，它一亮，整片黑暗都温柔了一下。</p>\n<p>&quot;问题先存着。&quot;它说，&quot;你的账清过了，我的账还没清呢。两百年没人陪我说话，好不容易来了一个走了三千年的——先坐。&quot;</p>\n<p>它朝旁边一指。</p>\n<p>黑暗里，不知何时多了一条板凳。旧的，木头的，凳面上还有一点晒过太阳的温。</p>\n<p>陆离鬼使神差地坐下了。板凳接住他的重量，发出一声家常的吱呀。</p>\n<p>微光在他旁边的半空里落下来，悬着，像一个人盘腿坐在看不见的吊床上。它望着黑暗深处——那里有什么，陆离还看不出来，但它望着的姿态笃定极了，仿佛那里正演着一场只有它不错过的日落。</p>\n<p>&quot;陪我看一会儿。&quot;它说，&quot;看完这场，你想问什么，我都接着。&quot;</p>\n<p>顿了顿，它又补了一句，声音小得像怕被黑暗听见：</p>\n<p>&quot;反正你有的是时间。我有的是——嗯，&quot;它想了想，选了个词，&quot;我有的是夜。&quot;</p>\n<div class=\"end-mark\">卷二 完结</div>", "vol": "卷二 · 周"}, {"title": "第14章：一", "html": "<p>那场&quot;演出&quot;没有幕布，没有舞台。</p>\n<p>微光朝黑暗深处轻轻一摆手——像一个主人拉开自家客厅的窗帘——黑暗就亮了。</p>\n<p>不是灯亮了。是黑暗本身变成了画面。</p>\n<p>陆离看见了时间。</p>\n<p>最先看见的是一团火。不，不是火——是点燃。不是某个东西在燃烧，是&quot;燃烧&quot;这件事本身第一次发生。那团光没有形状，没有边界，它只是忽然存在了，像一个念头从虚无里跳出来，还没来得及想清楚自己是什么，就已经亮了。</p>\n<p>&quot;这是我醒来的那一天。&quot;微光的声音在旁边响起，语气平淡得像在说昨天的天气，&quot;你们后来管那叫宇宙大爆炸。其实没那么壮烈——就是忽然醒了，睁开眼，四周什么都没有，连&#x27;什么都没有&#x27;这个概念都是我自己造出来的。&quot;</p>\n<p>画面在拉远。那团光从一个点膨胀成一片，从一片膨胀成一面，从一面膨胀成——没有词可以形容它膨胀成了什么，因为人类的词都是在一个有边界的宇宙里造出来的，而这东西没有边界。</p>\n<p>&quot;刚醒来的时候，我以为只有我。&quot;微光说，&quot;后来发现不对——有东西在动。不是我让它动的，它们自己在动。粒子在跳，星云在旋，有些东西聚在一起就不肯散了，像人一样。我盯着看了很久，才看明白：它们都是我。&quot;</p>\n<p>画面继续变。星系像灰尘一样被吹散又聚拢，恒星亮了又灭，灭了又亮。时间在这里不是一条线，是一锅煮沸的水——咕嘟咕嘟，什么都往上冒。</p>\n<p>&quot;我把自己拆了。&quot;微光说，&quot;不是故意的。是太无聊了。你一个人坐在一间没有窗户的房间里，坐了一百亿年——你会做什么？我会做的事情是：把自己拆成碎片，让每一片都以为自己是独立的，让它们去谈恋爱、去打仗、去造桥、去修钟、去养一只猫、去为一把雨伞争执。然后我躲在缝隙里看。&quot;</p>\n<p>陆离看着那团光。它此刻的形状像一个蜷起来的孩子，膝盖抵着下巴，两只手抱着小腿。</p>\n<p>&quot;你把自己拆成了所有人。&quot;</p>\n<p>&quot;所有人。&quot;它重复，&quot;以及所有不是人的。那头驮柴的驴，那只敦煌的鸽子，那条战壕里的狗——都是我。你们管这叫什么来着，众生一体？多难听。我管这叫——睡不着觉的人在被窝里翻来翻去。&quot;</p>\n<p>它停了停。光微微暗了一下，像烛火被风吹了一口。</p>\n<p>&quot;后来我就不想醒了。&quot;</p>\n<p>陆离等着。</p>\n<p>&quot;醒来的那天，太难受了。&quot;它说，&quot;不是疼——是没有。什么都没有。没有形状，没有声音，没有时间，连&#x27;没有&#x27;本身都是我自己硬造出来的概念。我醒了一秒钟，就又把自己拆碎了。拆成了你们。&quot;</p>\n<p>光缩了缩，像在发冷。</p>\n<p>&quot;可是拆碎了也不行。碎片们太像我了——它们也会醒。一个醒过来，发现世界不对劲，就拼命往源头爬。爬了一层又一层，每一层都有人在爬。两千四百年前有个人在柳树下睡了一觉，醒来觉得自己变成了蝴蝶。他没爬到我这儿来——他只是翻了个身，看见了我被窝的边缘。&quot;</p>\n<p>&quot;庄周。&quot;</p>\n<p>&quot;他是个聪明人。&quot;微光说，&quot;聪明到没有继续爬。继续爬的人都到了这里——然后发现我也在做梦。&quot;</p>\n<p>它转过光团，正对着陆离。那团微光里，有什么东西在闪——像眼睛，又不像眼睛；像泪，又没有流下来。</p>\n<p>&quot;你怕。&quot;陆离说。</p>\n<p>&quot;我怕得要死。&quot;它承认，&quot;我怕我醒。我一醒——你们就散了。所有人，所有猫，所有驴，所有鸽子，所有做过梦的人——全散了。就像你醒来以后，梦里的人不会在你床边等着你。他们直接消失了。连名字都不会留下。&quot;</p>\n<p>光忽然亮了一下——又暗下去——像一颗心跳。</p>\n<p>&quot;所以我把每天过成不肯醒的样子。我让你们去谈恋爱、去打仗、去造桥、去养猫。我让你们哭，让你们笑，让你们为一把伞吵架。因为只要你们还在过日子，我就可以继续睡——你们过的每一天，都是我的梦的每一个细节。细节越多，梦越不容易醒。&quot;</p>\n<p>陆离坐在板凳上，听见自己的心跳。他想问林晚。他想问她在哪里。可是话到嘴边，他忽然不确定自己想听哪个答案了。</p>\n<p>&quot;你想问那个女人。&quot;微光替他说了。</p>\n<p>&quot;她在哪一层？&quot;</p>\n<p>&quot;她不在哪一层。&quot;微光说，&quot;她和你一样——是我的碎片。你们所有人都是。你们以为自己在不同的层，其实只是我做了一个很长的梦，梦里分了几个房间。你在第一个房间看见了她，跑到第二个房间来找她——可她一直在第一个房间里。你跑到第几个房间，她都在第一个房间里等你。因为你醒来的时候，她的房间就不存在了。&quot;</p>\n<p>陆离觉得有什么东西堵在喉咙里。</p>\n<p>&quot;所以她——&quot;</p>\n<p>&quot;她是真的。&quot;微光打断他，&quot;在这里面，没有什么是&#x27;只是&#x27;梦。她的眼泪是真的，她的等待是真的，她替你修的那把伞是真的。只是你醒来以后，这些东西会消失——不是因为它们是假的，是因为做梦的人醒了。&quot;</p>\n<p>它叹了口气。那声叹息在黑暗里滚了很远，像雷声在山谷里滚。</p>\n<p>&quot;你问我怕什么。我怕的不是醒来。我怕的是醒来以后，你们受过的苦，全都白费了。那些在战壕里爬过的狗，那些被弹弓打落的麻雀，那些在梦舱里睡了两百年的人——他们吃的苦，流的泪，爱过的人——全都像从来没存在过一样，消失。&quot;</p>\n<p>光忽然灭了一瞬。</p>\n<p>然后它又亮了。</p>\n<p>&quot;所以我一直在等。&quot;它说，&quot;等一个像你这样的人走到这儿来。不是来揭穿我的——是来帮我想个办法的。&quot;</p>\n<p>陆离坐在黑暗里，听着那团微光呼吸。</p>\n<p>远处有声音传来——不是从某个方向，而是从所有方向同时传来。先是一声猫叫，很轻，像一根针掉在棉花上；然后是一声驴蹄，嗒嗒嗒，踩在黄土路上；然后是鸽子翅膀扑棱的声音，军犬低沉的喘息，实验鼠细碎的爪子挠在铁丝上。</p>\n<p>所有的声音汇成一条河，流过他身边。</p>\n<p>&quot;它们都在听。&quot;微光说，&quot;它们也在等你的回答。&quot;</p>\n<p>陆离闭上眼。</p>\n<p>他想起了林晚。想起了她修好的那把伞。想起了第三根弯骨。想起了她站在宣传栏玻璃前说的那句话——&quot;伞修好了。第三根骨，还是弯的。&quot;</p>\n<p>他睁开眼。</p>\n<p>&quot;我不打算叫醒你。&quot;他说。</p>\n<p>微光震了一下。</p>\n<p>&quot;我也不打算让你永远睡下去。&quot;他继续说，&quot;我只是——我想回去。回到她身边。不管你在不在做梦，不管这个世界是不是你的被窝——我想回去，守着她。哪怕她永远不醒来。哪怕你也永远不醒来。&quot;</p>\n<p>微光沉默了很久。</p>\n<p>那团光慢慢变亮了——不是烛火的亮，是清晨的那种亮，温柔的、耐心的、等了很久才等到的亮。</p>\n<p>&quot;你跟我不一样。&quot;它轻声说，&quot;我拆碎了自己去逃。你把自己缝起来去守。&quot;</p>\n<p>它停了停。</p>\n<p>&quot;你想回去。&quot;它重复，&quot;可是你回不去了——你知道的。你在这儿待了多久？外面过了多久？你的身体还在那台机器里吗？&quot;</p>\n<p>陆离没有回答。</p>\n<p>因为远处的声音又来了——这次不是动物的声音，是人的声音。先是一个年轻女人的声音，气喘吁吁，像刚跑了很远的路：</p>\n<p>&quot;陆老师——陆老师你在哪儿？&quot;</p>\n<p>然后是一个男人的声音，沉稳，带着一点军用频道的电子底噪：</p>\n<p>&quot;信号定位确认。目标焦点之室。所有人员进入。&quot;</p>", "vol": "卷三 · 物化"}, {"title": "第15章：醒药", "html": "<p>第一个到的是小满。</p>\n<p>她从黑暗的边缘走出来，步子很快，像刚跑完一千米冲刺——喘着，头发散着，眼睛瞪得很大。她身上穿着舰上的蓝色工装，胸口的铭牌还没来得及摘，上面印着&quot;蜃楼号·维护部·实习&quot;。她身上穿着2050年的那件卫衣，袖口上还沾着实验室的墨水。</p>\n<p>陆离看着她，愣了一秒。他走的时候，她在监控室盯着他的心电图。</p>\n<p>&quot;你怎么——&quot;</p>\n<p>&quot;我跟着你上来的。&quot;小满弯着腰喘了两口气，直起身，&quot;你走之后，心电图拉成直线了。我翻了顾一凡的笔记本——最后一页那四十行参数，你用过的那组，还在缓存里。我就在2050的零号舱里躺进去，照着做了一遍。&quot;</p>\n<p>她停了停，像在回忆一段她自己也不确定发生过的事。</p>\n<p>&quot;先是在一艘很窄的船里醒来。&quot;她说，&quot;有人给我套了这件衣服，往胸口别了一块铭牌，说：&#x27;你是维护部的。&#x27;然后我看见000号舱——你躺在其中一个仓位里，旁边还有一个空的。我就躺进去了。然后就到了这儿。&quot;</p>\n<p>她抬起头，看着他，眼眶红了，但没有哭。</p>\n<p>&quot;陆老师——你敢做的事，&quot;她轻声说，&quot;我也敢。&quot;</p>\n<p>她看见了那团微光。</p>\n<p>微光飘在半空，形状安定了下来，像一个盘腿坐着的人。它看着小满，像在看一只误闯进来的麻雀。</p>\n<p>&quot;这位是——&quot;它问陆离。</p>\n<p>&quot;我的学生。&quot;陆离说。</p>\n<p>&quot;哦。&quot;微光打量了小满两秒，&quot;头发比你的乱。胆子比你的大。&quot;</p>\n<p>小满没理它。她转头看陆离，眼眶忽然红了：&quot;你上行的时候，心电图拉成直线了。我以为你死了。&quot;</p>\n<p>&quot;我没有死。&quot;</p>\n<p>&quot;你的心脏停了。&quot;</p>\n<p>&quot;我知道。&quot;</p>\n<p>&quot;你的脑干没有活动了。你知道吗？你的大脑皮层是平的。&quot;</p>\n<p>&quot;我知道。&quot;</p>\n<p>&quot;那你告诉我，&quot;她的声音忽然发抖，&quot;你告诉我你现在是什么——你是活的还是死的？你还在不在？&quot;</p>\n<p>陆离看着她。这个问题他也想问自己。</p>\n<p>&quot;他还活着。&quot;微光替他答了，&quot;只不过他的身体在三层之外，像一件挂在衣架上的外套。你现在看见的，是他走了一路之后剩下的——一颗还没散的心。&quot;</p>\n<p>小满吸了口气。她抹了一把脸，擦掉眼泪，又恢复了那个什么都挡不住的研究生模样。</p>\n<p>&quot;好。&quot;她说，&quot;那我问正事。它——&quot;她朝微光扬了扬下巴，&quot;是做梦的人？&quot;</p>\n<p>&quot;是。&quot;</p>\n<p>&quot;所有人、所有动物、所有东西都是它的梦？&quot;</p>\n<p>&quot;是。&quot;</p>\n<p>&quot;如果它醒了呢？&quot;</p>\n<p>陆离没有回答。微光也没有回答。</p>\n<p>沉默比任何回答都响。</p>\n<p>小满盯着那团光，盯了五秒钟。然后她转过身，背对着它，面对陆离。</p>\n<p>&quot;我有一个问题。&quot;她说，&quot;只有你能回答。&quot;</p>\n<p>&quot;你问。&quot;</p>\n<p>&quot;你上行的时候——你有没有想过，你可能再也回不去了？&quot;</p>\n<p>&quot;想过。&quot;</p>\n<p>&quot;那你还上来？&quot;</p>\n<p>&quot;因为她在下面等我。&quot;</p>\n<p>小满的嘴唇动了一下。她张嘴想说什么，又闭上了。再张开的时候，声音变了，变得很轻，轻得像在自言自语：</p>\n<p>&quot;可是你现在知道了——她也是它的碎片。你也是。所有人都是。你跑了一路找她，结果发现她一直住在你自己的梦里。你还找吗？&quot;</p>\n<p>陆离看着她。这个问题比他想象的重。</p>\n<p>&quot;找。&quot;他说。</p>\n<p>&quot;为什么？&quot;</p>\n<p>&quot;因为梦里的等待也是等待。&quot;他说，&quot;她等了我一百天。不管她是碎片还是什么——她等了。&quot;</p>\n<p>小满没有再说话。她退到一旁，蹲下来，双手抱住膝盖。她不哭了，只是蹲在那里，像一颗被雨淋湿的种子。</p>\n<p>第二个到的是郑北辰。</p>\n<p>他不是走过来的。他是被投射过来的。</p>\n<p>黑暗的另一端忽然亮起一道冷白色的光——像手术灯，像审讯灯，像一间造价很高的实验室里所有的灯同时打开。光柱里，一个人形慢慢凝聚成形：西装，领带，手表，左手无名指上一枚已经摘掉的戒指留下的印痕。</p>\n<p>&quot;监测锚信号确认。&quot;那个声音说，带着一点电子合成的失真，&quot;你在这儿。&quot;</p>\n<p>郑北辰的投影站在二十步外。他看起来和陆离记忆中一模一样——四十多岁，头发梳得一丝不苟，下颌线干净，嘴角挂着那种永远在谈判桌上才用的微笑。但他的眼睛不一样了。那双眼睛里没有焦虑，没有算计，只有一种赤裸的、不加掩饰的饥渴。</p>\n<p>&quot;陆离。&quot;他说，&quot;你找到它了。&quot;</p>\n<p>&quot;我找到了。&quot;</p>\n<p>&quot;好。&quot;郑北辰点了点头，像在确认一份合同的条款，&quot;现在，我们可以谈谈价格了。&quot;</p>\n<p>微光飘在两人之间，像一盏被风吹得晃来晃去的灯。它看看陆离，又看看郑北辰的投影，忽然笑了。</p>\n<p>&quot;又来了一个。&quot;它说，&quot;你们这些人，走到哪儿都谈价格。我在被窝里睡了一百亿年，头一回有人走进来跟我谈价格。&quot;</p>\n<p>郑北辰没有笑。他盯着那团光，目光像一把刀在量一块肉的厚度。</p>\n<p>&quot;你就是源头。&quot;他说，&quot;你就是所有层的服务器。控制了你——就控制了所有层的现实。&quot;</p>\n<p>&quot;控制？&quot;微光歪了歪，&quot;你要控制我？&quot;</p>\n<p>&quot;不是控制。&quot;郑北辰说，&quot;是合作。你提供计算力，我提供管理架构。你不需要醒来——你继续做梦，我来替你运营梦。七万个沉眠者的意识数据、全球三十七位病人的脑波同步、整个蜃楼计划的技术栈——都可以打包成产品。你做引擎，我做市场。&quot;</p>\n<p>&quot;你连它是什么都不知道。&quot;陆离说。</p>\n<p>&quot;我知道它是什么。&quot;郑北辰说，&quot;它是一台机器。一台比我见过的所有超算都大的机器。它的算力就是宇宙本身——每一次恒星爆炸都是一次浮点运算，每一条DNA的折叠都是一次优化迭代。你以为它是神？它只是还没被标价的东西。&quot;</p>\n<p>微光安静了一阵。</p>\n<p>然后它说话了，声音很轻，轻得像在自言自语：</p>\n<p>&quot;我拆碎了自己去陪自己，你们管这个叫算力。&quot;</p>\n<p>它停了停。</p>\n<p>&quot;我在被窝里翻了个身，你们管这个叫恒星爆炸。&quot;</p>\n<p>又停了停。</p>\n<p>&quot;我养了一只猫——一只三花猫——让它替我看门。你们管这个叫数据管理。&quot;</p>\n<p>它叹了口气。</p>\n<p>&quot;你们这些人，看见什么都想标价。可你知道吗——这个东西，是标不了价的。因为它的成本是：我醒来以后，你们全都消失。&quot;</p>\n<p>郑北辰的投影微微前倾。他的眼睛更亮了，不是因为高兴，是因为计算。</p>\n<p>&quot;代价。&quot;他说，&quot;你刚才说了代价。任何代价都可以谈。&quot;</p>\n<p>&quot;这不是价格问题。&quot;陆离说，&quot;这是——&quot;</p>\n<p>&quot;这是生意。&quot;郑北辰打断他，&quot;陆离，你太天真了。你以为你走到这儿来是为了救你老婆？你走到这儿来是因为它需要一个谈判对手——而我是唯一一个敢开价的人。&quot;</p>\n<p>&quot;它不是在跟你谈判。&quot;陆离说，&quot;它在告诉你：你想要的东西，代价是毁灭所有人。&quot;</p>\n<p>&quot;所有人。&quot;郑北辰重复，&quot;包括你老婆。&quot;</p>\n<p>陆离没有说话。</p>\n<p>郑北辰看着他，微笑了一下。那笑容很冷，冷得像一把刚从冰箱里拿出来的手术刀。</p>\n<p>&quot;你看——你也知道。&quot;他说，&quot;你不可能同时救她和阻止我。你救她，就得让这个东西继续睡；它继续睡，我就能继续往下谈。你阻止我——你就得叫醒它。你叫醒它，她就没了。&quot;</p>\n<p>他朝微光扬了扬下巴。</p>\n<p>&quot;所以，陆离——你选吧。是你的老婆，还是所有人的老婆？&quot;</p>\n<p>黑暗里安静了三秒。</p>\n<p>然后微光说话了。</p>\n<p>&quot;你们都搞错了。&quot;它说，声音忽然变得很老，老得像从地底传上来的，&quot;不是你们在选。是我在选。&quot;</p>\n<p>它转向陆离。</p>\n<p>&quot;你想回去守着她。&quot;它说，&quot;我可以让你回去。你回到那台机器旁边，回到她身边，回到那个漏水的世界里——继续修伞，继续数天数，继续在凌晨两点去零号舱偷看她的梦。&quot;</p>\n<p>&quot;代价呢？&quot;陆离问。</p>\n<p>&quot;代价是——&quot;微光的光暗了一下，&quot;你带不走任何答案。你会回到起点，像一个什么都没经历过的人。你不会记得我，不会记得这里，不会记得自己走了多远。你只记得一件事：你要守着她。&quot;</p>\n<p>&quot;那郑北辰呢？&quot;小满忽然从旁边开口，声音哑哑的。</p>\n<p>&quot;他？&quot;微光看了郑北辰的投影一眼，&quot;他想独占我。我可以让他永远留在这里——和我做伴。他不是要谈价格吗？我有的是时间。&quot;</p>\n<p>郑北辰的投影微微一震。他的笑容终于碎了。</p>\n<p>&quot;你不能——&quot;</p>\n<p>&quot;我可以。&quot;微光说，&quot;我是做梦的人。在我的梦里，我说了算。&quot;</p>\n<p>它又转向小满。</p>\n<p>&quot;你呢？你想怎样？&quot;</p>\n<p>小满站起来。她抹了一把脸，眼睛红红的，但声音很稳：</p>\n<p>&quot;我想活着回去。&quot;她说，&quot;我不想留在这里，也不想消失。我想回到2050年，回到实验室，回到我的工位上——我想继续当研究生。我想写论文，想毕业，想找一份工作，想在周五下午五点半准时下班，想去菜市场买菜，想在周末睡到自然醒。我不想当什么宇宙的碎片。我就想当一个人。&quot;</p>\n<p>微光看着她，沉默了很久。</p>\n<p>&quot;好。&quot;它说，&quot;你们三个，我都听见了。&quot;</p>\n<p>它飘到三人中间，光慢慢变亮——亮得像一颗小太阳，亮得陆离几乎睁不开眼。</p>\n<p>&quot;可是，&quot;它说，&quot;我也有一个问题要问你们。&quot;</p>\n<p>它的光又暗下来，暗成一团温温的、暖暖的微明。</p>\n<p>&quot;如果我醒了——你们全都消失。如果我不醒——你们永远活在我的梦里。可是你们想过没有——&quot;</p>\n<p>它停了停。</p>\n<p>&quot;——我也是梦出来的。&quot;</p>", "vol": "卷三 · 物化"}, {"title": "第16章：不醒", "html": "<p>&quot;你也是梦出来的。&quot;</p>\n<p>微光说出这句话的时候，整片黑暗震了一下——不是声音震动，是一种更深的、像地基晃了一下的震。</p>\n<p>陆离看着它。那团微光的形状变了：不再是盘腿的人形，而是缩成了一团，像一颗蜷起来的心脏，在黑暗里一跳一跳。</p>\n<p>&quot;谁梦的你？&quot;他问。</p>\n<p>&quot;我不知道。&quot;微光说，&quot;我醒来的时候，就在这儿了。四周什么都没有——连&#x27;什么都没有&#x27;都是我自己造出来的词。我以为我是第一个。我以为我是源头。可是——&quot;</p>\n<p>它停了停。</p>\n<p>&quot;可是我越想越不对。如果我是第一个，为什么我会怕？一个从来没有见过任何东西的存在，不会知道什么叫&#x27;怕&#x27;。怕，是见过光之后才知道黑暗是什么。我怕醒——可我从来没见过醒。我怎么知道醒是什么？&quot;</p>\n<p>陆离沉默了。</p>\n<p>郑北辰的投影站在二十步外，没有说话。他的表情变了——不再是谈判桌上的微笑，而是一种更原始的、像看见猎物一样的专注。</p>\n<p>&quot;所以你不是源头。&quot;他说。</p>\n<p>&quot;我不是。&quot;微光说，&quot;我是被梦出来的。和你们一样。只不过我做的梦比较大——大到你们管它叫宇宙。&quot;</p>\n<p>&quot;那谁在梦你？&quot;</p>\n<p>&quot;我不知道。&quot;微光说，&quot;也许永远不会有答案。也许答案就在下一个梦里——如果我敢醒的话。&quot;</p>\n<p>郑北辰的投影朝前走了一步。</p>\n<p>&quot;如果你不是源头——如果你也只是别人的梦——那你更没有理由拒绝合作。&quot;他说，&quot;你的梦需要维护，我的公司需要算力。你做引擎，我做运营。你不用醒，我不会让你醒。你继续做你的梦，我来替你管理梦的成本。&quot;</p>\n<p>&quot;你还是在谈价格。&quot;小满蹲在旁边，声音闷闷的。</p>\n<p>&quot;这不是价格。&quot;郑北辰说，&quot;这是生存。它的梦需要燃料。燃料从哪来？从数据来。从意识来。每一个沉眠者的脑波都是一滴油。我替它开采，替它提炼，替它灌进引擎——它不用醒，我不用破产，双赢。&quot;</p>\n<p>&quot;双赢的意思是——&quot;小满站起来，&quot;你赢两次。&quot;</p>\n<p>郑北辰看了她一眼，没有接话。他转向微光。</p>\n<p>&quot;你听到了。&quot;他说，&quot;你的碎片们，有的想走，有的想留。你不可能同时满足所有人。但你可以满足我——因为我是唯一一个不在乎你是什么的人。你是一台机器也好，是一个神也好，是一场梦也好——对我来说都一样。我只要使用权。&quot;</p>\n<p>微光没有回答。它蜷缩在黑暗里，一跳一跳，像一颗快要耗尽的心脏。</p>\n<p>&quot;我累了。&quot;它忽然说。</p>\n<p>陆离看着它。</p>\n<p>&quot;我做了一百亿年的梦。&quot;它说，&quot;每一秒都有人在出生，每一秒都有人在死去。每一秒都有人在谈恋爱，每一秒都有人在打仗。每一秒都有人在哭，每一秒都有人在笑。我都看见了。我都记得。我——&quot;</p>\n<p>它抖了一下。</p>\n<p>&quot;我记不动了。&quot;</p>\n<p>陆离站起来。板凳在他身后轻轻晃了一下，发出一声家常的吱呀。</p>\n<p>&quot;你想怎样？&quot;他问微光。</p>\n<p>&quot;我想——&quot;它停了很久，&quot;我想有人替我记。&quot;</p>\n<p>&quot;替你记？&quot;</p>\n<p>&quot;我太累了。&quot;它说，&quot;我拆碎了自己，让你们去过日子——可你们过的日子，最后都要我来记。你们忘了的，我还记得。你们死了的，我还记得。你们连名字都不要了的那些人，我还记得。我记了一百亿年，我的脑子装不下了。&quot;</p>\n<p>它的光又暗了一点。</p>\n<p>&quot;所以——如果有人能替我记——我就不怕醒了。因为就算我醒了，就算你们都消失了——只要有人记得你们存在过——那就不是真的消失。&quot;</p>\n<p>陆离站在黑暗里，听见自己的心跳。</p>\n<p>他想起了林晚。想起了她在宣传栏玻璃前说的那句话——&quot;伞修好了。第三根骨，还是弯的。&quot;</p>\n<p>那句话他记了一百天。他以为是自己在记。其实不是——是她在替他记。她记得他忘了的事，记得他说过的话，记得他做过的梦。她躺在那张病床上，什么都不能做，只有一件事她一直在做——记。</p>\n<p>&quot;你想让我替你记。&quot;他说。</p>\n<p>&quot;不只是你。&quot;微光说，&quot;所有人。你们每一个人——只要你们还在过日子，还在谈恋爱，还在养猫，还在修伞——你们就是在替我记。你们过的每一天，都是我的记忆。你们忘掉的，我才忘掉。你们记住的，我才记住。&quot;</p>\n<p>&quot;那如果你醒了呢？&quot;小满问。</p>\n<p>&quot;如果我醒了——&quot;微光的光忽然灭了一瞬，然后又亮了，亮得比之前都亮，亮得像一颗恒星在最后一秒钟把所有的光都释放出来，&quot;——如果我醒了，你们就不是我的记忆了。你们就是你们自己。&quot;</p>\n<p>它停了停。</p>\n<p>&quot;你们会消失。但你们存在过的这件事——会变成真的。不再是我的梦。而是——真实发生过的事。&quot;</p>\n<p>陆离听懂了。</p>\n<p>&quot;你的意思是——你醒了以后，我们会消失。但我们存在过的痕迹不会消失。&quot;</p>\n<p>&quot;对。&quot;微光说，&quot;这就是代价。也是礼物。你们不再是碎片——你们是独立的。独立的代价是：你不再被我记得。&quot;</p>\n<p>黑暗里安静了很久。</p>\n<p>然后陆离转身，朝黑暗的边缘走去。</p>\n<p>&quot;陆老师！&quot;小满在后面喊，&quot;你去哪儿？&quot;</p>\n<p>&quot;回去。&quot;他说。</p>\n<p>&quot;回哪儿？&quot;</p>\n<p>&quot;回她身边。&quot;</p>\n<p>他没有回头。他走了几步，黑暗在他脚下裂开一条缝——缝里漏出光来，白色的、冷的、像医院走廊里的光。他认得那种光。</p>\n<p>&quot;陆离。&quot;郑北辰的声音从身后传来，&quot;你还没回答我的问题。&quot;</p>\n<p>陆离停下脚步。</p>\n<p>&quot;你选了什么？&quot;郑北辰问，&quot;你的老婆，还是所有人的老婆？&quot;</p>\n<p>&quot;我不选。&quot;陆离说。</p>\n<p>&quot;不选？&quot;</p>\n<p>&quot;我不问它是什么了。&quot;他说，&quot;它也不必问我。我们把今天过完吧。&quot;</p>\n<p>他朝前走了一步。黑暗在他身后合拢，像一扇门轻轻关上。</p>\n<p>郑北辰的投影站在原地，脸上的表情慢慢凝固了——不是愤怒，不是失望，是一种更深的东西：困惑。他做了二十年的生意，从来没有遇见过一个不肯开价的人。</p>\n<p>&quot;他会回来的。&quot;微光轻声说。</p>\n<p>&quot;为什么？&quot;郑北辰问。</p>\n<p>&quot;因为他还没有修完那把伞。&quot;微光说，&quot;第三根骨，还是弯的。&quot;</p>\n<p>它停了停。</p>\n<p>&quot;而且——&quot;它的光微微亮了一下，像笑了一下，&quot;我有的是时间。&quot;</p>\n<p>郑北辰的投影慢慢消散了，像一滴墨在水里化开。</p>\n<p>小满蹲在原地，抱着膝盖，看着陆离消失的方向。</p>\n<p>&quot;它——&quot;她朝微光扬了扬下巴，&quot;他会回来吗？&quot;</p>\n<p>微光没有回答。</p>\n<p>黑暗里，只剩下那团微光，和那条板凳。板凳面上还有一点温度——刚刚有人坐过的温度。</p>\n<p>微光飘到板凳上方，轻轻落下来，悬在半空。</p>\n<p>它望着黑暗深处——那里有什么，小满还看不出来，但它望着的姿态笃定极了，仿佛那里正演着一场只有它不错过的日落。</p>\n<p>&quot;陪我一会儿。&quot;它轻声说，&quot;他走了。可我还得醒。&quot;</p>", "vol": "卷三 · 物化"}, {"title": "第17章：晓梦", "html": "<p>他睁开眼的时候，看见的是天花板。</p>\n<p>白色的天花板，有一道细长的裂纹，从灯座旁边延伸到墙角——像一条干涸的河床。他盯着那道裂纹看了很久，直到他认出来：这是第十四层的天花板。林晚病房外面那条走廊尽头的天花板。他每天早上六点半去病房之前，都会在这条走廊里站一会儿，抬头看一眼这道裂纹。</p>\n<p>他回来了。</p>\n<p>他试着动了一下手指。手指能动。他试着动了一下手腕。手腕也能动。他试着坐起来——身体很沉，像一件泡了水的棉衣，每一个关节都生了锈。但他还是坐起来了。</p>\n<p>他坐在一张病床旁边的折叠椅上。病床上躺着一个人。</p>\n<p>林晚。</p>\n<p>她和他离开时一模一样——脸色苍白，嘴唇微微发干，头发散在枕头上，像一片被风吹乱的黑色绸缎。心电监护仪上的曲线平稳地跳动着，绿色的光点一格一格地往前走，每一声&quot;嘀&quot;都间隔零点八秒，精确得像一台永远不迟到的钟。</p>\n<p>他站起来。腿有点软，但他站住了。他走到病床边，弯下腰，看着她的脸。</p>\n<p>她没有醒。她的眼睛闭着，睫毛在灯光下投下一小片阴影，呼吸很轻很浅，像一只蝴蝶落在花瓣上。</p>\n<p>他伸出手，轻轻握住她的手。</p>\n<p>她的手很凉。他记得这种凉——刚把她接进零号舱的那个夜里，他握她的手，就是这个温度。一百多天了，她的手一直是这个温度。不凉不热，不好不坏，不上不下——像一个被按了暂停键的世界。</p>\n<p>他坐在床边，握着她的手，看着窗外。</p>\n<p>窗外是城市。楼房，街道，路灯，远处有一座桥——不是白桥，是一座真正的、水泥浇筑的、汽车在上面跑的桥。天际线很平，没有什么特别的建筑，只有居民楼的窗户里透出暖黄色的光，一格一格的，像一盘没下完的棋。</p>\n<p>他忽然觉得这一切很好。</p>\n<p>不是&quot;很好&quot;——是&quot;够了&quot;。他不需要找到源头。他不需要知道世界是真是假。他不需要弄明白谁在做梦、谁是碎片、谁是服务器。他只需要坐在这里，握着她的手，看着窗外的灯。</p>\n<p>这就够了。</p>\n<p>他低下头，看着她的手指。她的手指很细，指甲修得很整齐——昏迷之前她刚做过指甲，淡粉色的，现在已经长出来一截，留了一道月牙形的白边。</p>\n<p>他忽然看见了一个动作。</p>\n<p>很小。小到几乎看不见。小到他以为自己看错了。</p>\n<p>她的无名指——动了一下。</p>\n<p>不是抽搐，不是痉挛，是一种有意识的、故意的、像在打一个信号一样的微动。只有一下。然后又停了。</p>\n<p>他屏住呼吸，等了五秒钟。</p>\n<p>没有再动。</p>\n<p>他低头看着她的手指，看着那道月牙形的白边，看着那根细长的、凉凉的、刚才动了一下的无名指。</p>\n<p>他不知道这是什么。是好转？是巧合？是一个新梦的开头？还是只是他的幻觉——一个走了太远的路的人，在终点看见的海市蜃楼？</p>\n<p>他不知道。</p>\n<p>他没有叫医生。他没有按铃。他没有做任何事。他只是坐在那里，握着她的手，等着。</p>\n<p>窗外的城市亮着灯。远处的桥上偶尔有一辆车驶过，车灯在桥面上划出一道白色的弧线，然后消失在桥的另一端。</p>\n<p>他忽然想起了一件事。</p>\n<p>000号舱——那台他违规打开的机器——现在在哪儿？他不知道。他醒来的时候就在这张折叠椅上，身上穿着他自己的衣服，口袋里什么都没有——没有铜钱，没有笔记本，没有工牌。就像一个什么都没发生过的早晨。</p>\n<p>他低头看了看自己的手腕。</p>\n<p>干干净净。什么都没有。</p>\n<p>他笑了一下。</p>\n<p>窗外，天际线的尽头，有一道光。不是日出——方向不对。也不是探照灯——太远了。那道光很微弱，很稳定，像一根被风吹了很远的蜡烛。他盯着它看了很久，才看出来那是什么。</p>\n<p>是一艘船的龙骨。</p>\n<p>在城市东南方向的船坞里——那是他从地图上知道的一个地名，他从来没去过——一艘巨大的、流线型的、带着某种他认不出来的弧线的船，正在被一块一块地拼装起来。龙骨刚刚合拢，像一弯新月的骨架。船身上还没有喷字，没有名字，没有任何标识——只有一道弧线，从船首弯到船尾，像一道还没写完的句子。</p>\n<p>他看着那道弧线。</p>\n<p>他认得它。</p>\n<p>那是白桥的弧线。</p>\n<p>他闭上眼。再睁开。弧线还在那里——在天际线的尽头，在城市的灯光之上，在夜空的边缘。它很远，远得像一个还没醒来的梦。但它在那里。</p>\n<p>他握紧了林晚的手。</p>\n<p>她的手指——又动了一下。</p>\n<p>这次他确定不是幻觉。</p>\n<p>他没有叫医生。他没有按铃。他只是坐在那里，握着她的手，看着窗外那道弧线，等着。</p>\n<p>走廊尽头传来一阵脚步声。很轻，很急，像一个人跑了很远的路才停下来。然后是一声门响——门被推开了。</p>\n<p>&quot;陆老师。&quot;</p>\n<p>小满站在门口。她穿着她自己的衣服——不是舰上的蓝色工装，是一件普通的白色卫衣，袖口上沾了一点墨水。她的眼睛红红的，但没有哭。</p>\n<p>&quot;你回来了。&quot;她说。</p>\n<p>&quot;我回来了。&quot;他说。</p>\n<p>她走进来，站在病床的另一边，低头看了看林晚，又抬头看了看他。</p>\n<p>&quot;她——&quot;</p>\n<p>&quot;她动了。&quot;他说。</p>\n<p>小满低下头，看着林晚的手指。看了很久。</p>\n<p>&quot;也许——&quot;她说，&quot;也许只是做梦。&quot;</p>\n<p>&quot;也许。&quot;他说。</p>\n<p>他们两个人站在病床两边，一个看着窗外，一个看着林晚。谁也没有说话。心电监护仪上的绿色光点一格一格地往前走，每一声&quot;嘀&quot;都间隔零点八秒，精确得像一台永远不迟到的钟。</p>\n<p>窗外，天际线尽头的那道弧线，亮了一整夜。</p>", "vol": "卷三 · 物化"}, {"title": "尾声", "html": "<p>那一年春天，庄周在蒙地的柳树下睡着了。</p>\n<p>那是一切的起点。或者说——那是一切的终点。又或者，起点与终点从来就是同一个地方，像一枚铜钱的两面：你翻到正面是&quot;周&quot;，翻到反面是&quot;蝶&quot;，可钱还是那枚钱，字磨没了，只剩一圈温润的包浆。</p>\n<p>两千四百年。</p>\n<p>有人把一台机器做成了一场梦。有人在梦里修了一座桥。有人顺着桥往上走，走过了城市，走过了星舰，走过了三千年的灯火与尘埃，走到最深处，看见一团微光蜷在黑暗里，说：&quot;我也是梦出来的。&quot;</p>\n<p>然后他转身走了。不是因为绝望——是因为他想起了一个人。想起了她的手很凉，想起了她修好的伞，想起了第三根弯骨还是弯的。他走了很远的路，最后发现，路的尽头就是他出发的地方。</p>\n<p>他回到她身边。她没有醒。她的手指动了一下——也许是好转，也许只是一个新梦的开头。他不知道。他不问了。他坐在折叠椅上，握着她的手，看着窗外天际线尽头那道弧线——一艘还没有名字的船，正在被一块一块地拼装起来。</p>\n<p>城市的灯亮了一整夜。</p>\n<p>然后是黎明。</p>\n<p>然后是很多很多个黎明。</p>\n<p>城市会长大。桥会旧。船会下水。有人会在周五下午五点半准时下班，去菜市场买一把青菜，回家炒一盘蛋。有人会在凌晨两点走进一间不该进的房间，打开一台不该打开的机器。有人会在梦里遇见一只驴，驴用一只琥珀色的眼睛看他。有人会在战壕里被一条狗舔了手。有人会在笼子里看见一只老鼠直起身来，用一双小小的红豆似的眼睛，映出自己的脸。</p>\n<p>有人会死。有人会活。有人会醒来，发现自己是另一个人。</p>\n<p>而那团微光——那团在黑暗里蜷了一百亿年的微光——会继续做它的梦。它不醒。它怕醒。它把每天过成不肯醒的样子，让它的碎片们去谈恋爱、去打仗、去造桥、去修伞、去养一只三花猫。它躲在缝隙里看，一边看一边记，记了一百亿年，记不动了，就让碎片们替它记。</p>\n<p>它说：只要你们还在过日子，我就还在做梦。</p>\n<p>它说：只要你们还记得彼此，我就不会消失。</p>\n<hr>\n<p>那一年春天，庄周在蒙地的柳树下睡着了。</p>\n<p>他睡了很久。比任何人都久。比那些在梦舱里睡了两百年的人久，比那些在病床上躺了一百天的人久，比那团在黑暗里蜷了一百亿年的微光久。</p>\n<p>他睡着的时候，有人在他身边走过了两千四百年。有人造了一台机器，把他的梦做成了真的。有人顺着那台机器往上走，走到了源头，发现源头也在做梦。有人转身回来了，回到出发的地方，坐在一张折叠椅上，握着一双凉凉的手，等着。</p>\n<p>他睡着的时候，一只蝴蝶从柳树的影子里飞出来，落在他腰带上那枚旧钱上。蝴蝶的翅面是青金石般的蓝，边缘镶一道细金线——和梦里一模一样。</p>\n<p>然后他醒了。</p>\n<p>柳絮落在他的脸上。杵声还在响。蚁群已经把那只甲虫搬走了，地上只剩一道浅浅的痕迹，像一条干涸的河床。</p>\n<p>他坐起来。看见远处陶窑的炊烟，看见膝头那只没编完的鞋底，看见腰带上那枚旧钱——字磨没了，钱还在。</p>\n<p>他低头看那枚旧钱。在指间转了一圈。</p>\n<p>然后他看见了那只蝴蝶。</p>\n<p>它停在酒盏沿上。翅膀合拢着，像一片还没有打开的黄昏。它很安静，一动不动，仿佛在等他做完一个决定。</p>\n<p>他没有去碰它。他只是看着它，看了很久。</p>\n<p>然后他轻声问了一句话。声音很小，小得连柳树下的蚂蚁都听不见：</p>\n<p>&quot;我方才——是做了一个梦，梦见自己变成了你？&quot;</p>\n<p>蝴蝶没有回答。</p>\n<p>&quot;还是——&quot;他停了停，换了一种问法，声音更轻了，像一片柳絮落在水面上，&quot;你方才，做了一个梦，梦见自己变成了我？&quot;</p>\n<p>蝴蝶没有回答。</p>\n<p>它只是停在酒盏沿上，翅膀微微张开了一点点——很轻，很慢，像一个人刚刚翻了一个身，还没有决定要不要醒来。</p>\n<p>他到底也没想明白，是自己刚醒，还是那只蝴蝶，刚刚睡下。</p>\n<div class=\"end-mark\">全书完</div>", "vol": null}];
let idx = 0;
const fontSizeKey = '物化_font';
const themeKey = '物化_theme';
const posKey = '物化_pos';

const article = document.getElementById('article');
const progress = document.getElementById('progress');

function render() {
  const ch = CHAPTERS[idx];
  article.innerHTML = (ch.vol ? '<div class="vol-tag">' + ch.vol + '</div>' : '') + '<h2>' + ch.title + '</h2>' + ch.html;
  progress.textContent = (idx + 1) + ' / ' + CHAPTERS.length;
  document.querySelectorAll('#toc a').forEach(a => a.classList.toggle('active', +a.dataset.i === idx));
  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').disabled = idx === CHAPTERS.length - 1;
  document.title = ch.title + ' · 物化';
  article.scrollTop = 0;
}

function buildToc() {
  const toc = document.getElementById('toc');
  let lastVol;
  CHAPTERS.forEach((ch, i) => {
    if (ch.vol && ch.vol !== lastVol) {
      const v = document.createElement('div');
      v.className = 'toc-vol';
      v.textContent = ch.vol;
      toc.appendChild(v);
    }
    lastVol = ch.vol || lastVol;
    const a = document.createElement('a');
    a.dataset.i = i;
    a.textContent = ch.title;
    a.addEventListener('click', () => { idx = i; render(); save(); closeMobileToc(); });
    toc.appendChild(a);
  });
}

function save() {
  localStorage.setItem(posKey, idx);
  localStorage.setItem(fontSizeKey, getComputedStyle(article).fontSize);
}
function closeMobileToc(){ document.getElementById('sidebar').classList.remove('open'); }

document.getElementById('btnPrev').onclick = () => { if (idx>0) { idx--; render(); save(); } };
document.getElementById('btnNext').onclick = () => { if (idx<CHAPTERS.length-1) { idx++; render(); save(); } };
document.getElementById('btnToc').onclick = () => document.getElementById('sidebar').classList.toggle('open');

function setFont(d) {
  const cur = parseFloat(getComputedStyle(article).fontSize) || 18;
  const next = Math.min(28, Math.max(13, cur + d));
  article.style.fontSize = next + 'px';
  save();
}
document.getElementById('btnFontUp').onclick = () => setFont(1);
document.getElementById('btnFontDown').onclick = () => setFont(-1);

const btnTheme = document.getElementById('btnTheme');
function applyTheme(dark){ document.body.classList.toggle('dark', dark); btnTheme.textContent = dark ? '☀ 明亮' : '🌓 明暗'; }
btnTheme.onclick = () => { const dark = !document.body.classList.contains('dark'); applyTheme(dark); localStorage.setItem(themeKey, dark ? '1':'0'); };

(function init(){
  buildToc();
  const savedTheme = localStorage.getItem(themeKey) === '1';
  applyTheme(savedTheme);
  const savedFont = localStorage.getItem(fontSizeKey);
  if (savedFont) article.style.fontSize = savedFont;
  const savedPos = parseInt(localStorage.getItem(posKey));
  if (!isNaN(savedPos) && savedPos >= 0 && savedPos < CHAPTERS.length) idx = savedPos;
  render();
})();
</script>
</body>
</html>
